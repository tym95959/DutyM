<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Koveli · Secure Access</title>
    <!--
        ==================================================================
        KOVELI TWO-STEP AUTHENTICATION (Single Window)
        - If device NOT authorized: show device master password prompt
        - If device IS authorized: show normal user login (username + password)
        - No redirects between windows - seamless transition in same window
        ==================================================================
        
        Required external files:
        - deviceauth.js: contains window.AUTH_CONFIG.deviceMasterPassword
        - users.js: contains users array with username, passwordHash, Level, RCNo
    -->
    <script src="deviceauth.js"></script>
    <script src="users.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #f9efda, #f2e2bc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="rgba(200,165,80,0.1)" stroke-width="0.7"><circle cx="16" cy="16" r="5"/><path d="M16 3 L16 29 M3 16 L29 16"/></svg>');
            background-repeat: repeat;
            background-size: 38px;
            pointer-events: none;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 252, 242, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            box-shadow: 0 35px 55px -20px rgba(70, 45, 15, 0.5), inset 0 1px 0 0 #fffef5, 0 0 0 1px #f2dfae;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .gold-stripe {
            height: 6px;
            background: linear-gradient(90deg, #eac168, #f5da94, #efcd7c);
        }

        .card-header {
            padding: 2rem 2rem 0.5rem 2rem;
            background: linear-gradient(115deg, #fcf6e8, #fff9ed);
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f3e7cf;
            padding: 0.3rem 1rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #7b5c2c;
            border: 1px solid #f7e5bd;
            margin-bottom: 1rem;
            transition: all 0.3s;
        }

        .logo-badge.authorized {
            background: #eaf7e1;
            border-color: #9bc86a;
            color: #2a5c0c;
        }

        h1 {
            font-size: 2rem;
            font-weight: 550;
            background: linear-gradient(135deg, #624a1e, #b38734);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .sub-line {
            color: #b48b44;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #f0c46c;
            padding-left: 0.9rem;
        }

        .status-chip {
            background: #fff3e2;
            border-radius: 40px;
            padding: 0.2rem 0.9rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #a5742e;
        }

        .auth-panel {
            padding: 1.8rem 2rem 2rem;
            transition: opacity 0.3s ease;
        }

        .hidden-panel {
            display: none;
        }

        .input-field {
            margin-bottom: 1.7rem;
        }

        .input-field label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.4px;
            color: #a47d3f;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #fffdf7;
            border: 2px solid #ead3a0;
            border-radius: 60px;
            padding: 0.1rem 1.2rem;
            transition: all 0.2s;
            box-shadow: inset 0 1px 3px #f7efdf;
        }

        .input-wrapper:focus-within {
            border-color: #d6aa4a;
            box-shadow: 0 0 0 4px rgba(215, 170, 70, 0.25), inset 0 1px 3px #fff1da;
        }

        .input-icon {
            font-size: 1.2rem;
            color: #c79848;
            margin-right: 0.7rem;
        }

        .input-wrapper input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 0.9rem 0;
            font-size: 1rem;
            outline: none;
            color: #2b200b;
            font-weight: 500;
        }

        .input-wrapper input::placeholder {
            color: #cfb97f;
            font-weight: 400;
        }

        .toggle-password {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: #b68f47;
            padding: 0 5px;
            transition: 0.1s;
        }

        .toggle-password:hover {
            color: #8f672b;
        }

        .auth-button {
            background: linear-gradient(105deg, #efcf86, #efc876, #f3d183);
            border: none;
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #3b2c11;
            border-radius: 60px;
            margin: 1.3rem 0 1rem;
            cursor: pointer;
            box-shadow: 0 12px 20px -12px #a27734, 0 0 0 2px #fffceb, 0 0 0 5px #fef7e8;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-button:hover {
            background: linear-gradient(105deg, #f7da9a, #f5d48c, #fbdf98);
            transform: scale(1.01);
        }

        .auth-button:active {
            transform: scale(0.97);
        }

        .auth-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message-panel {
            background: #faf3e2;
            border-radius: 40px;
            padding: 0.8rem 1.2rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 5px solid #eabe6c;
            color: #5a431c;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .message-panel.error {
            background: #ffe9e3;
            border-left-color: #d4513a;
            color: #8f2f1b;
        }

        .message-panel.success {
            background: #eaf7e1;
            border-left-color: #5e9b3a;
            color: #295a0c;
        }

        .message-panel.warning {
            background: #fff2df;
            border-left-color: #e6a017;
        }

        .footer-security {
            font-size: 0.7rem;
            text-align: center;
            padding: 1rem 1.5rem 1.3rem;
            border-top: 1px solid #eedcae;
            color: #a88648;
            background: #fefaf1;
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .footer-security span {
            background: #f8efdd;
            padding: 0.2rem 0.9rem;
            border-radius: 50px;
        }

        .loader-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top-color: #5f451c;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .transition-fade {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input:disabled {
            background: #faf4e8;
            color: #8f7a51;
            cursor: default;
        }
    </style>
</head>
<body>

<div class="auth-card" id="authCard">
    <div class="gold-stripe"></div>
    <div class="card-header">
        <div class="logo-badge" id="logoBadge">
            <span>🏛️</span> KOVELI LOUNGE
        </div>
        <h1 id="mainTitle">Secure Access</h1>
        <div class="sub-line">
            <span id="subText">⚡ device verification</span>
            <span class="status-chip" id="statusChip">🔐 secure terminal</span>
        </div>
    </div>

    <!-- PANEL 1: Device Authorization (shown when device NOT authorized) -->
    <div id="devicePanel" class="auth-panel">
        <div class="input-field">
            <label for="devicePassword">DEVICE MASTER PASSWORD</label>
            <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" id="devicePassword" placeholder="Enter device master password" autocomplete="off">
                <button type="button" class="toggle-password" id="toggleDevicePw">👁️</button>
            </div>
        </div>
        <button type="button" class="auth-button" id="deviceAuthBtn">
            <span>⛁</span> Authorize Device <span>→</span>
        </button>
        <div id="deviceMessage" class="message-panel">
            <span>🔔</span>
            <span>First-time setup: Enter device master password to register this device.</span>
        </div>
    </div>

    <!-- PANEL 2: User Login (shown when device IS authorized) -->
    <div id="userPanel" class="auth-panel hidden-panel">
        <div class="input-field">
            <label for="username">USERNAME</label>
            <div class="input-wrapper">
                <span class="input-icon">👤</span>
                <input type="text" id="username" placeholder="Your username" autocomplete="off">
            </div>
        </div>
        <div class="input-field">
            <label for="userPassword">PASSWORD</label>
            <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" id="userPassword" placeholder="Your password" autocomplete="off">
                <button type="button" class="toggle-password" id="toggleUserPw">👁️</button>
            </div>
        </div>
        <button type="button" class="auth-button" id="userAuthBtn">
            <span>→</span> Sign In <span>→</span>
        </button>
        <div id="userMessage" class="message-panel">
            <span>👋</span>
            <span>Device authorized. Please enter your user credentials.</span>
        </div>
    </div>

    <div class="footer-security">
        <span>✔️ device‑bound security</span>
        <span>🔐 two‑layer protection</span>
        <span>⚡ seamless access</span>
    </div>
</div>

<script>
    (function() {
        // ==================================================================
        // KOVELI SINGLE-WINDOW TWO-STEP AUTHENTICATION
        // ==================================================================
        // BEHAVIOR:
        // - If device NOT authorized → show device password panel
        // - After device password success → save to localStorage, SWITCH to user panel
        // - If device IS authorized (on page load) → directly show user panel
        // - No redirects, no new windows — seamless transition
        // ==================================================================

        // Storage keys
        const DEVICE_AUTH_KEY = 'koveli_device_authorized';
        
        // DOM elements - Device Panel
        const devicePanel = document.getElementById('devicePanel');
        const userPanel = document.getElementById('userPanel');
        const devicePasswordInput = document.getElementById('devicePassword');
        const deviceAuthBtn = document.getElementById('deviceAuthBtn');
        const deviceMessageDiv = document.getElementById('deviceMessage');
        const toggleDevicePw = document.getElementById('toggleDevicePw');
        
        // DOM elements - User Panel
        const usernameInput = document.getElementById('username');
        const userPasswordInput = document.getElementById('userPassword');
        const userAuthBtn = document.getElementById('userAuthBtn');
        const userMessageDiv = document.getElementById('userMessage');
        const toggleUserPw = document.getElementById('toggleUserPw');
        
        // Header elements
        const logoBadge = document.getElementById('logoBadge');
        const mainTitle = document.getElementById('mainTitle');
        const subText = document.getElementById('subText');
        const statusChip = document.getElementById('statusChip');
        
        let isProcessing = false;

        // Helper: Set device panel message
        function setDeviceMessage(text, type = 'info') {
            const msgSpan = deviceMessageDiv.querySelector('span:last-child');
            msgSpan.innerText = text;
            deviceMessageDiv.className = 'message-panel';
            if (type === 'error') deviceMessageDiv.classList.add('error');
            else if (type === 'success') deviceMessageDiv.classList.add('success');
            else if (type === 'warning') deviceMessageDiv.classList.add('warning');
        }

        // Helper: Set user panel message
        function setUserMessage(text, type = 'info') {
            const msgSpan = userMessageDiv.querySelector('span:last-child');
            msgSpan.innerText = text;
            userMessageDiv.className = 'message-panel';
            if (type === 'error') userMessageDiv.classList.add('error');
            else if (type === 'success') userMessageDiv.classList.add('success');
            else if (type === 'warning') userMessageDiv.classList.add('warning');
        }

        // Check if device is already authorized
        function isDeviceAuthorized() {
            return localStorage.getItem(DEVICE_AUTH_KEY) === 'true';
        }

        // Mark device as authorized (persists forever)
        function markDeviceAuthorized() {
            localStorage.setItem(DEVICE_AUTH_KEY, 'true');
            localStorage.setItem('koveli_device_auth_time', new Date().toISOString());
        }

        // Clear device auth (optional logout function - can be called from console if needed)
        window.clearDeviceAuth = function() {
            localStorage.removeItem(DEVICE_AUTH_KEY);
            localStorage.removeItem('koveli_device_auth_time');
            location.reload();
        };

        // Check if deviceauth.js config is loaded
        function isDeviceConfigLoaded() {
            if (typeof window.AUTH_CONFIG === 'undefined') {
                setDeviceMessage('❌ deviceauth.js not loaded. Please ensure the file exists.', 'error');
                deviceAuthBtn.disabled = true;
                return false;
            }
            if (!window.AUTH_CONFIG.deviceMasterPassword) {
                setDeviceMessage('❌ Configuration error: deviceMasterPassword missing in deviceauth.js', 'error');
                deviceAuthBtn.disabled = true;
                return false;
            }
            return true;
        }

        // Check if users.js is loaded
        function isUsersLoaded() {
            if (typeof users === 'undefined' || !Array.isArray(users)) {
                setUserMessage('❌ users.js not loaded or invalid. Cannot authenticate user.', 'error');
                return false;
            }
            return true;
        }

        // ==================== DEVICE AUTHORIZATION ====================
        function authorizeDevice() {
            const enteredPassword = devicePasswordInput.value;
            
            if (!enteredPassword || enteredPassword.trim() === '') {
                setDeviceMessage('⚠️ Please enter the device master password.', 'warning');
                return false;
            }

            const correctPassword = window.AUTH_CONFIG.deviceMasterPassword;
            
            if (enteredPassword !== correctPassword) {
                setDeviceMessage('❌ Invalid device master password.', 'error');
                devicePasswordInput.value = '';
                devicePasswordInput.focus();
                return false;
            }

            // SUCCESS: Authorize device
            markDeviceAuthorized();
            setDeviceMessage('✅ Device authorized successfully! Loading login panel...', 'success');
            
            // Switch to user panel after brief delay
            setTimeout(() => {
                switchToUserPanel();
            }, 800);
            
            return true;
        }

        // ==================== SWITCH TO USER PANEL ====================
        function switchToUserPanel() {
            // Animate transition
            devicePanel.style.opacity = '0';
            userPanel.style.opacity = '0';
            
            setTimeout(() => {
                devicePanel.classList.add('hidden-panel');
                userPanel.classList.remove('hidden-panel');
                userPanel.classList.add('transition-fade');
                
                // Update header UI
                logoBadge.classList.add('authorized');
                logoBadge.innerHTML = '<span>✅</span> DEVICE AUTHORIZED';
                mainTitle.innerHTML = 'Welcome Back';
                subText.innerHTML = '👤 user authentication';
                statusChip.innerHTML = '🔓 device verified';
                statusChip.style.background = '#eaf7e1';
                statusChip.style.color = '#2a5c0c';
                
                userPanel.style.opacity = '1';
                
                // Focus on username field
                setTimeout(() => {
                    usernameInput.focus();
                }, 100);
            }, 200);
        }

        // ==================== USER AUTHENTICATION (from users.js) ====================
        
        // SHA-256 hash function
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Authenticate user
        async function authenticateUser(username, password) {
            if (!username.trim() || !password) {
                setUserMessage('⚠️ Please enter both username and password.', 'warning');
                return false;
            }
            
            if (!isUsersLoaded()) return false;
            
            // Find user (case-insensitive)
            const matchedUser = users.find(u => 
                u.username && u.username.toLowerCase() === username.trim().toLowerCase()
            );
            
            if (!matchedUser) {
                setUserMessage('❌ Invalid username or password.', 'error');
                return false;
            }
            
            try {
                const hashedInput = await hashPassword(password);
                if (!matchedUser.passwordHash || hashedInput !== matchedUser.passwordHash) {
                    setUserMessage('❌ Invalid username or password.', 'error');
                    return false;
                }
                
                // SUCCESS: Store user data for dashboard
                const level = matchedUser.Level || matchedUser.level || 'operator';
                const rcno = matchedUser.RCNo || matchedUser.rcno || matchedUser.RCno || 'N/A';
                
                localStorage.setItem('username', matchedUser.username);
                localStorage.setItem('level', level.toString());
                localStorage.setItem('rcno', rcno.toString());
                
                const userProfile = {
                    username: matchedUser.username,
                    level: level,
                    rcno: rcno,
                    name: matchedUser.name || '',
                    loginTime: new Date().toISOString()
                };
                localStorage.setItem('loggedInUser', JSON.stringify(userProfile));
                
                setUserMessage('✅ Login successful! Redirecting to dashboard...', 'success');
                
                // Disable inputs during redirect
                userAuthBtn.disabled = true;
                usernameInput.disabled = true;
                userPasswordInput.disabled = true;
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1200);
                
                return true;
            } catch (cryptoError) {
                console.error('Crypto error:', cryptoError);
                setUserMessage('❌ Authentication error. Please try again.', 'error');
                return false;
            }
        }

        // ==================== EVENT HANDLERS ====================
        
        // Device authorization button
        deviceAuthBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            if (!isDeviceConfigLoaded()) return;
            
            isProcessing = true;
            deviceAuthBtn.disabled = true;
            const originalText = deviceAuthBtn.innerHTML;
            deviceAuthBtn.innerHTML = `<span class="loader-icon"></span> Verifying device...`;
            
            setTimeout(() => {
                authorizeDevice();
                if (!isDeviceAuthorized()) {
                    // Failed
                    deviceAuthBtn.disabled = false;
                    deviceAuthBtn.innerHTML = originalText;
                }
                isProcessing = false;
            }, 300);
        });

        // User login button
        userAuthBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            
            const username = usernameInput.value;
            const password = userPasswordInput.value;
            
            if (!username || !password) {
                setUserMessage('⚠️ Please enter both username and password.', 'warning');
                return;
            }
            
            isProcessing = true;
            userAuthBtn.disabled = true;
            const originalText = userAuthBtn.innerHTML;
            userAuthBtn.innerHTML = `<span class="loader-icon"></span> Authenticating...`;
            
            try {
                await authenticateUser(username, password);
                if (!localStorage.getItem('username')) {
                    // Login failed
                    userAuthBtn.disabled = false;
                    userAuthBtn.innerHTML = originalText;
                    userPasswordInput.value = '';
                    userPasswordInput.focus();
                }
            } catch (err) {
                console.error(err);
                setUserMessage('Authentication error. Please try again.', 'error');
                userAuthBtn.disabled = false;
                userAuthBtn.innerHTML = originalText;
            } finally {
                isProcessing = false;
            }
        });
        
        // Enter key support
        devicePasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') deviceAuthBtn.click();
        });
        
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') userPasswordInput.focus();
        });
        
        userPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') userAuthBtn.click();
        });
        
        // Toggle password visibility
        toggleDevicePw.addEventListener('click', () => {
            const type = devicePasswordInput.type === 'password' ? 'text' : 'password';
            devicePasswordInput.type = type;
            toggleDevicePw.textContent = type === 'password' ? '👁️' : '🙈';
        });
        
        toggleUserPw.addEventListener('click', () => {
            const type = userPasswordInput.type === 'password' ? 'text' : 'password';
            userPasswordInput.type = type;
            toggleUserPw.textContent = type === 'password' ? '👁️' : '🙈';
        });
        
        // ==================== INITIALIZATION ====================
        // Determine which panel to show based on device authorization status
        
        function initialize() {
            if (isDeviceAuthorized()) {
                // Device already authorized → show user panel directly
                devicePanel.classList.add('hidden-panel');
                userPanel.classList.remove('hidden-panel');
                userPanel.classList.add('transition-fade');
                
                // Update header for authorized state
                logoBadge.classList.add('authorized');
                logoBadge.innerHTML = '<span>✅</span> DEVICE AUTHORIZED';
                mainTitle.innerHTML = 'Welcome Back';
                subText.innerHTML = '👤 user authentication';
                statusChip.innerHTML = '🔓 device verified';
                statusChip.style.background = '#eaf7e1';
                statusChip.style.color = '#2a5c0c';
                
                setUserMessage('Device already authorized. Please enter your credentials.', 'info');
                setTimeout(() => usernameInput.focus(), 100);
            } else {
                // Device not authorized → show device panel
                devicePanel.classList.remove('hidden-panel');
                userPanel.classList.add('hidden-panel');
                
                // Check config and focus
                setTimeout(() => {
                    if (isDeviceConfigLoaded()) {
                        devicePasswordInput.focus();
                    }
                }, 50);
            }
        }
        
        // Wait for all scripts to load
        setTimeout(initialize, 50);
        
        console.log('Koveli Secure Access · Device-first then user login (single window)');
    })();
</script>
</body>
</html>
