<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Koveli · Two-Factor Device Authorization</title>
    <!--
        ==================================================================
        KOVELI TWO-STEP AUTHENTICATION
        Step 1: Device Master Password (one-time, persists across sessions)
        Step 2: Normal User Login (username + password from users.js)
        
        External files required:
        - deviceauth.js: contains window.AUTH_CONFIG.deviceMasterPassword
        - users.js: contains users array with username, passwordHash, Level, RCNo
        ==================================================================
    -->
    <script src="deviceauth.js"></script>
    <script src="users.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #f9efda, #f2e2bc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="rgba(200,165,80,0.1)" stroke-width="0.7"><circle cx="16" cy="16" r="5"/><path d="M16 3 L16 29 M3 16 L29 16"/></svg>');
            background-repeat: repeat;
            background-size: 38px;
            pointer-events: none;
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 252, 242, 0.96);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            box-shadow: 0 35px 55px -20px rgba(70, 45, 15, 0.5), inset 0 1px 0 0 #fffef5, 0 0 0 1px #f2dfae;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .gold-stripe {
            height: 6px;
            background: linear-gradient(90deg, #eac168, #f5da94, #efcd7c);
        }

        .card-header {
            padding: 2rem 2rem 0.5rem 2rem;
            background: linear-gradient(115deg, #fcf6e8, #fff9ed);
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f3e7cf;
            padding: 0.3rem 1rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #7b5c2c;
            border: 1px solid #f7e5bd;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 550;
            background: linear-gradient(135deg, #624a1e, #b38734);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .sub-line {
            color: #b48b44;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #f0c46c;
            padding-left: 0.9rem;
        }

        .step-indicator {
            display: flex;
            gap: 0.8rem;
            margin: 1rem 2rem 0 2rem;
            padding: 0.5rem 0;
        }

        .step {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.5rem 0.8rem;
            border-radius: 40px;
            background: #f4ecd9;
            color: #a88648;
            transition: all 0.3s;
        }

        .step.active {
            background: #efcf86;
            color: #3b2c11;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .step.completed {
            background: #5e9b3a;
            color: white;
        }

        .step.completed span:first-child {
            text-decoration: none;
        }

        .step span:first-child {
            font-size: 1rem;
        }

        .auth-panel {
            padding: 1.5rem 2rem 2rem;
            transition: opacity 0.3s ease;
        }

        .input-field {
            margin-bottom: 1.7rem;
        }

        .input-field label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.4px;
            color: #a47d3f;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #fffdf7;
            border: 2px solid #ead3a0;
            border-radius: 60px;
            padding: 0.1rem 1.2rem;
            transition: all 0.2s;
            box-shadow: inset 0 1px 3px #f7efdf;
        }

        .input-wrapper:focus-within {
            border-color: #d6aa4a;
            box-shadow: 0 0 0 4px rgba(215, 170, 70, 0.25), inset 0 1px 3px #fff1da;
        }

        .input-icon {
            font-size: 1.2rem;
            color: #c79848;
            margin-right: 0.7rem;
        }

        .input-wrapper input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 0.9rem 0;
            font-size: 1rem;
            outline: none;
            color: #2b200b;
            font-weight: 500;
        }

        .input-wrapper input::placeholder {
            color: #cfb97f;
            font-weight: 400;
        }

        .toggle-password {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            color: #b68f47;
            padding: 0 5px;
            transition: 0.1s;
        }

        .auth-button {
            background: linear-gradient(105deg, #efcf86, #efc876, #f3d183);
            border: none;
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #3b2c11;
            border-radius: 60px;
            margin: 1.3rem 0 1rem;
            cursor: pointer;
            box-shadow: 0 12px 20px -12px #a27734, 0 0 0 2px #fffceb, 0 0 0 5px #fef7e8;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-button:hover {
            background: linear-gradient(105deg, #f7da9a, #f5d48c, #fbdf98);
            transform: scale(1.01);
        }

        .auth-button:active {
            transform: scale(0.97);
        }

        .auth-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message-panel {
            background: #faf3e2;
            border-radius: 40px;
            padding: 0.8rem 1.2rem;
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 5px solid #eabe6c;
            color: #5a431c;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .message-panel.error {
            background: #ffe9e3;
            border-left-color: #d4513a;
            color: #8f2f1b;
        }

        .message-panel.success {
            background: #eaf7e1;
            border-left-color: #5e9b3a;
            color: #295a0c;
        }

        .message-panel.warning {
            background: #fff2df;
            border-left-color: #e6a017;
        }

        .footer-security {
            font-size: 0.7rem;
            text-align: center;
            padding: 1rem 1.5rem 1.3rem;
            border-top: 1px solid #eedcae;
            color: #a88648;
            background: #fefaf1;
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .loader-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top-color: #5f451c;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="auth-card" id="authCard">
    <div class="gold-stripe"></div>
    <div class="card-header">
        <div class="logo-badge" id="logoBadge">
            <span>🏛️</span> KOVELI LOUNGE
        </div>
        <h1>Secure Access</h1>
        <div class="sub-line">
            <span>⚡ two‑step verification</span>
            <span class="device-chip">🔐 device + user auth</span>
        </div>
    </div>

    <!-- Step Indicators -->
    <div class="step-indicator">
        <div class="step" id="step1Indicator">
            <span>🔒</span> <span>Device Auth</span>
        </div>
        <div class="step" id="step2Indicator">
            <span>👤</span> <span>User Login</span>
        </div>
    </div>

    <!-- Step 1: Device Master Password Panel -->
    <div id="step1Panel" class="auth-panel">
        <div class="input-field">
            <label for="devicePassword">DEVICE MASTER PASSWORD (ONE-TIME)</label>
            <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" id="devicePassword" placeholder="Enter device master password" autocomplete="off">
                <button type="button" class="toggle-password" id="toggleDevicePw">👁️</button>
            </div>
        </div>
        <button type="button" class="auth-button" id="deviceAuthBtn">
            <span>⛁</span> Authorize Device <span>→</span>
        </button>
        <div id="deviceMessage" class="message-panel">
            <span>🔔</span>
            <span>Step 1: Enter device master password (required once per device)</span>
        </div>
    </div>

    <!-- Step 2: Normal User Login Panel (hidden initially) -->
    <div id="step2Panel" class="auth-panel hidden">
        <div class="input-field">
            <label for="username">USERNAME</label>
            <div class="input-wrapper">
                <span class="input-icon">👤</span>
                <input type="text" id="username" placeholder="Your username" autocomplete="off">
            </div>
        </div>
        <div class="input-field">
            <label for="userPassword">PASSWORD</label>
            <div class="input-wrapper">
                <span class="input-icon">🔒</span>
                <input type="password" id="userPassword" placeholder="Your password" autocomplete="off">
                <button type="button" class="toggle-password" id="toggleUserPw">👁️</button>
            </div>
        </div>
        <button type="button" class="auth-button" id="userAuthBtn">
            <span>→</span> Sign In <span>→</span>
        </button>
        <div id="userMessage" class="message-panel">
            <span>👋</span>
            <span>Step 2: Enter your user credentials</span>
        </div>
    </div>

    <div class="footer-security">
        <span>✔️ device-bound session</span>
        <span>🔐 two-layer security</span>
        <span>⏱️ device auth persists</span>
    </div>
</div>

<script>
    (function() {
        // ==================================================================
        // KOVELI TWO-STEP AUTHENTICATION
        // Step 1: Device Master Password (one-time, persists in localStorage)
        // Step 2: Normal User Login (username + password from users.js)
        // ==================================================================

        // Storage keys
        const DEVICE_AUTH_KEY = 'koveli_device_authorized';
        const DEVICE_AUTH_VERSION = 'koveli_device_v1';
        
        // DOM elements - Step 1
        const step1Panel = document.getElementById('step1Panel');
        const step2Panel = document.getElementById('step2Panel');
        const step1Indicator = document.getElementById('step1Indicator');
        const step2Indicator = document.getElementById('step2Indicator');
        const devicePasswordInput = document.getElementById('devicePassword');
        const deviceAuthBtn = document.getElementById('deviceAuthBtn');
        const deviceMessageDiv = document.getElementById('deviceMessage');
        const toggleDevicePw = document.getElementById('toggleDevicePw');
        
        // DOM elements - Step 2
        const usernameInput = document.getElementById('username');
        const userPasswordInput = document.getElementById('userPassword');
        const userAuthBtn = document.getElementById('userAuthBtn');
        const userMessageDiv = document.getElementById('userMessage');
        const toggleUserPw = document.getElementById('toggleUserPw');
        
        let isProcessing = false;

        // Helper: Update message in step 1
        function setDeviceMessage(text, type = 'info') {
            const msgSpan = deviceMessageDiv.querySelector('span:last-child');
            msgSpan.innerText = text;
            deviceMessageDiv.className = 'message-panel';
            if (type === 'error') deviceMessageDiv.classList.add('error');
            else if (type === 'success') deviceMessageDiv.classList.add('success');
            else if (type === 'warning') deviceMessageDiv.classList.add('warning');
        }

        // Helper: Update message in step 2
        function setUserMessage(text, type = 'info') {
            const msgSpan = userMessageDiv.querySelector('span:last-child');
            msgSpan.innerText = text;
            userMessageDiv.className = 'message-panel';
            if (type === 'error') userMessageDiv.classList.add('error');
            else if (type === 'success') userMessageDiv.classList.add('success');
            else if (type === 'warning') userMessageDiv.classList.add('warning');
        }

        // Check if device is already authorized (persistent)
        function isDeviceAuthorized() {
            return localStorage.getItem(DEVICE_AUTH_KEY) === 'true';
        }

        // Mark device as authorized (persists across sessions)
        function markDeviceAuthorized() {
            localStorage.setItem(DEVICE_AUTH_KEY, 'true');
            localStorage.setItem(DEVICE_AUTH_VERSION, new Date().toISOString());
        }

        // Clear device auth (optional logout function)
        window.clearDeviceAuth = function() {
            localStorage.removeItem(DEVICE_AUTH_KEY);
            localStorage.removeItem(DEVICE_AUTH_VERSION);
            location.reload();
        };

        // Check if AUTH_CONFIG is loaded from deviceauth.js
        function isDeviceConfigLoaded() {
            if (typeof window.AUTH_CONFIG === 'undefined') {
                setDeviceMessage('❌ deviceauth.js not loaded. Missing device master password.', 'error');
                deviceAuthBtn.disabled = true;
                return false;
            }
            if (!window.AUTH_CONFIG.deviceMasterPassword) {
                setDeviceMessage('❌ Configuration error: deviceMasterPassword missing.', 'error');
                deviceAuthBtn.disabled = true;
                return false;
            }
            return true;
        }

        // Verify device master password
        function verifyDevicePassword(enteredPassword) {
            if (!enteredPassword || enteredPassword.trim() === '') {
                setDeviceMessage('⚠️ Please enter the device master password.', 'warning');
                return false;
            }
            
            const correctPassword = window.AUTH_CONFIG.deviceMasterPassword;
            if (enteredPassword !== correctPassword) {
                setDeviceMessage('❌ Invalid device master password.', 'error');
                return false;
            }
            
            // Success
            markDeviceAuthorized();
            setDeviceMessage('✅ Device authorized! Moving to user login...', 'success');
            return true;
        }

        // Switch to Step 2 (User Login)
        function showStep2() {
            step1Panel.classList.add('hidden');
            step2Panel.classList.remove('hidden');
            
            // Update step indicators
            step1Indicator.classList.remove('active');
            step1Indicator.classList.add('completed');
            step2Indicator.classList.add('active');
            step2Indicator.classList.remove('completed');
            
            // Update badge
            const badge = document.getElementById('logoBadge');
            badge.innerHTML = '<span>✅</span> DEVICE AUTHORIZED · ENTER USER CREDENTIALS';
            badge.style.background = '#eaf7e1';
            badge.style.borderColor = '#9bc86a';
            
            // Focus on username
            setTimeout(() => usernameInput.focus(), 100);
        }
        
        // If device already authorized, skip straight to step 2
        function checkAndHandleExistingDeviceAuth() {
            if (isDeviceAuthorized()) {
                // Device already authorized, show step 2 directly
                step1Panel.classList.add('hidden');
                step2Panel.classList.remove('hidden');
                step1Indicator.classList.remove('active');
                step1Indicator.classList.add('completed');
                step2Indicator.classList.add('active');
                
                const badge = document.getElementById('logoBadge');
                badge.innerHTML = '<span>✅</span> DEVICE AUTHORIZED · ENTER USER CREDENTIALS';
                badge.style.background = '#eaf7e1';
                badge.style.borderColor = '#9bc86a';
                
                setUserMessage('Device already authorized. Please enter your user credentials.', 'info');
                setTimeout(() => usernameInput.focus(), 100);
                return true;
            }
            return false;
        }

        // ==================== USER AUTHENTICATION (from users.js) ====================
        
        // SHA-256 hash function
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Check if users.js is loaded
        function isUsersLoaded() {
            if (typeof users === 'undefined' || !Array.isArray(users)) {
                setUserMessage('❌ users.js not loaded or invalid. Cannot authenticate user.', 'error');
                return false;
            }
            return true;
        }

        // Authenticate user with username and password
        async function authenticateUser(username, password) {
            if (!username.trim() || !password) {
                setUserMessage('⚠️ Please enter both username and password.', 'warning');
                return false;
            }
            
            if (!isUsersLoaded()) return false;
            
            // Find user (case-insensitive)
            const matchedUser = users.find(u => 
                u.username && u.username.toLowerCase() === username.trim().toLowerCase()
            );
            
            if (!matchedUser) {
                setUserMessage('❌ Invalid username or password.', 'error');
                return false;
            }
            
            try {
                const hashedInput = await hashPassword(password);
                if (!matchedUser.passwordHash || hashedInput !== matchedUser.passwordHash) {
                    setUserMessage('❌ Invalid username or password.', 'error');
                    return false;
                }
                
                // SUCCESS: Store user data for dashboard
                const level = matchedUser.Level || matchedUser.level || 'operator';
                const rcno = matchedUser.RCNo || matchedUser.rcno || matchedUser.RCno || 'N/A';
                
                localStorage.setItem('username', matchedUser.username);
                localStorage.setItem('level', level.toString());
                localStorage.setItem('rcno', rcno.toString());
                
                const userProfile = {
                    username: matchedUser.username,
                    level: level,
                    rcno: rcno,
                    name: matchedUser.name || '',
                    loginTime: new Date().toISOString()
                };
                localStorage.setItem('loggedInUser', JSON.stringify(userProfile));
                
                setUserMessage('✅ Login successful! Redirecting to dashboard...', 'success');
                
                // Disable button during redirect
                userAuthBtn.disabled = true;
                usernameInput.disabled = true;
                userPasswordInput.disabled = true;
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1200);
                
                return true;
            } catch (cryptoError) {
                console.error('Crypto error:', cryptoError);
                setUserMessage('❌ Authentication error. Please try again.', 'error');
                return false;
            }
        }

        // ==================== EVENT HANDLERS ====================
        
        // Step 1: Device authorization
        deviceAuthBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            
            if (!isDeviceConfigLoaded()) return;
            
            const password = devicePasswordInput.value;
            if (!password) {
                setDeviceMessage('⚠️ Please enter the device master password.', 'warning');
                return;
            }
            
            isProcessing = true;
            deviceAuthBtn.disabled = true;
            const originalText = deviceAuthBtn.innerHTML;
            deviceAuthBtn.innerHTML = `<span class="loader-icon"></span> Verifying device...`;
            
            try {
                await new Promise(resolve => setTimeout(resolve, 300));
                const success = verifyDevicePassword(password);
                
                if (success) {
                    // Clear password field for security
                    devicePasswordInput.value = '';
                    // Move to step 2
                    showStep2();
                } else {
                    deviceAuthBtn.disabled = false;
                    deviceAuthBtn.innerHTML = originalText;
                    devicePasswordInput.value = '';
                    devicePasswordInput.focus();
                }
            } catch (err) {
                console.error(err);
                setDeviceMessage('Unexpected error. Please try again.', 'error');
                deviceAuthBtn.disabled = false;
                deviceAuthBtn.innerHTML = originalText;
            } finally {
                isProcessing = false;
            }
        });
        
        // Step 2: User login
        userAuthBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            
            const username = usernameInput.value;
            const password = userPasswordInput.value;
            
            if (!username || !password) {
                setUserMessage('⚠️ Please enter both username and password.', 'warning');
                return;
            }
            
            isProcessing = true;
            userAuthBtn.disabled = true;
            const originalText = userAuthBtn.innerHTML;
            userAuthBtn.innerHTML = `<span class="loader-icon"></span> Authenticating...`;
            
            try {
                await authenticateUser(username, password);
                if (!localStorage.getItem('username')) {
                    // Login failed, re-enable
                    userAuthBtn.disabled = false;
                    userAuthBtn.innerHTML = originalText;
                    userPasswordInput.value = '';
                    userPasswordInput.focus();
                }
            } catch (err) {
                console.error(err);
                setUserMessage('Authentication error. Please try again.', 'error');
                userAuthBtn.disabled = false;
                userAuthBtn.innerHTML = originalText;
            } finally {
                isProcessing = false;
            }
        });
        
        // Allow Enter key to submit in step 1
        devicePasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                deviceAuthBtn.click();
            }
        });
        
        // Allow Enter key to submit in step 2
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') userPasswordInput.focus();
        });
        userPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') userAuthBtn.click();
        });
        
        // Toggle password visibility
        toggleDevicePw.addEventListener('click', () => {
            const type = devicePasswordInput.type === 'password' ? 'text' : 'password';
            devicePasswordInput.type = type;
            toggleDevicePw.textContent = type === 'password' ? '👁️' : '🙈';
        });
        
        toggleUserPw.addEventListener('click', () => {
            const type = userPasswordInput.type === 'password' ? 'text' : 'password';
            userPasswordInput.type = type;
            toggleUserPw.textContent = type === 'password' ? '👁️' : '🙈';
        });
        
        // ==================== INITIALIZATION ====================
        
        // Check if device is already authorized
        setTimeout(() => {
            if (!checkAndHandleExistingDeviceAuth()) {
                // Device not authorized, show step 1
                step1Panel.classList.remove('hidden');
                step2Panel.classList.add('hidden');
                step1Indicator.classList.add('active');
                step2Indicator.classList.remove('active', 'completed');
                
                // Check config
                if (!isDeviceConfigLoaded()) {
                    // error already shown
                } else {
                    devicePasswordInput.focus();
                }
            }
        }, 50);
        
        console.log('Koveli Two-Step Auth · Device password required once, then user login');
    })();
</script>
</body>
</html>
