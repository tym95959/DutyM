<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Flight Reports – Closed Flights</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="fireshift.js"></script>
    <script src="Co.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f0e1, #fff5e6);
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header-bar {
            background: #2c3e50;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .back-link {
            background: #e6b800;
            color: #2c3e50;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
        }
        
        .admin-panel {
            background: #fff9e6;
            border-radius: 20px;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 2px solid #e6b800;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .prefix-list { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .prefix-tag {
            background: white;
            border: 2px solid #e6b800;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .remove-prefix {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 20px;
            width: 18px;
            height: 18px;
            font-size: 11px;
            cursor: pointer;
        }
        .add-prefix-form { display: flex; gap: 8px; }
        .add-prefix-form input {
            padding: 5px 10px;
            border-radius: 30px;
            border: 1px solid #e6b800;
            width: 70px;
            text-transform: uppercase;
        }
        .add-prefix-form button, .reset-defaults {
            background: #6b8e23;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
        }
        .reset-defaults { background: #7f8c8d; }
        
        .filter-card {
            background: white;
            border-radius: 24px;
            padding: 18px 24px;
            margin-bottom: 24px;
            border: 2px solid #e6b800;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .filter-group label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            color: #8b6913;
        }
        .filter-group select {
            padding: 10px 14px;
            border-radius: 40px;
            border: 2px solid #e2dccf;
            background: white;
            font-size: 0.85rem;
            min-width: 180px;
        }
        .refresh-btn {
            background: #e6b800;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .stats-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-badge {
            background: white;
            border-radius: 60px;
            padding: 8px 20px;
            border-left: 5px solid #e6b800;
        }
        .report-card {
            background: white;
            border-radius: 20px;
            border: 2px solid #e6b800;
            overflow: hidden;
            margin-bottom: 28px;
        }
        .flight-header {
            background: #fff9ef;
            padding: 16px 22px;
            border-bottom: 2px solid #e6b800;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .flight-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.8rem;
            margin-top: 8px;
        }
        .flight-meta span {
            background: #f0ede5;
            padding: 4px 14px;
            border-radius: 30px;
        }
        .status-closed-badge {
            background: #c68b5e;
            color: white;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .table-wrapper { overflow-x: auto; max-height: 500px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        th {
            background: #e6b800;
            color: white;
            padding: 12px 10px;
            text-align: left;
            position: sticky;
            top: 0;
        }
        td { padding: 10px; border-bottom: 1px solid rgba(230, 184, 0, 0.2); }
        .empty-message { text-align: center; padding: 40px; color: #8b6913; }
        .loading-spinner { text-align: center; padding: 40px; }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e6b80030;
            border-radius: 50%;
            border-top-color: #e6b800;
            animation: spin 1s infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .airline-tag { background: #e6b800; padding: 2px 8px; border-radius: 30px; font-size: 0.7rem; margin-left: 8px; }
        .delay-row { background-color: rgba(220, 53, 69, 0.05); }
        .delay-badge { background: #dc3545; color: white; font-size: 9px; padding: 2px 8px; border-radius: 20px; margin-left: 8px; }
        .footer-note { text-align: center; font-size: 0.7rem; color: #8b7a5c; margin-top: 25px; padding-top: 15px; border-top: 1px solid #e6b80040; }
        
        /* EXACT PRINT STYLES FROM ORIGINAL CODE */
        @media print {
            body { background: white; padding: 0; margin: 0.5in; }
            .header-bar, .admin-panel, .filter-card, .stats-row, .back-link, .refresh-btn, .footer-note { display: none !important; }
            .report-card { border: 1px solid #000; box-shadow: none; break-inside: avoid; }
            .flight-header { background: #f5f0e1; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            th { background: #e6b800 !important; color: black; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .table-wrapper { overflow: visible; max-height: none; }
            tr, td, th { page-break-inside: avoid; }
            thead { display: table-header-group; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-bar">
        <div class="title-section">
            <h1>✈ Airline Flight Reports</h1>
            <p>Closed flights only • Read-only</p>
        </div>
        <a href="javascript:history.back()" class="back-link">← Back to Main</a>
    </div>
    
    <div class="admin-panel">
        <div class="admin-title">⚙️ Airline Prefixes (Admin)</div>
        <div class="prefix-list" id="prefixListContainer"></div>
        <div class="add-prefix-form">
            <input type="text" id="newPrefixInput" placeholder="EK" maxlength="2">
            <button id="addPrefixBtn">+ Add</button>
            <button id="resetDefaultsBtn" class="reset-defaults">Reset</button>
        </div>
    </div>
    
    <div class="filter-card">
        <div class="filter-group">
            <label>📅 Date</label>
            <select id="dateSelect"></select>
        </div>
        <div class="filter-group">
            <label>✈ Airline</label>
            <select id="airlineSelect"></select>
        </div>
        <div class="filter-group">
            <label>🔍 Flight No</label>
            <select id="flightSelect" disabled></select>
        </div>
        <button class="refresh-btn" id="loadBtn">📋 Load Report</button>
        <button class="refresh-btn" id="printBtn" style="background:#4a6fa5; color:white;">🖨️ PRINT</button>
        <button class="refresh-btn" id="refreshBtn" style="background:#6c757d;">🔄 Refresh</button>
    </div>
    
    <div class="stats-row" id="statsRow" style="display: none;">
        <div class="stat-badge" id="flightStat">Flight: --</div>
        <div class="stat-badge" id="paxStat">Passengers: 0</div>
    </div>
    
    <div id="reportsContainer">
        <div class="empty-message">Click "Refresh" to load closed flights from your database.</div>
    </div>
    <div class="footer-note">⚠️ Only flights closed from the main page are shown • No edits allowed</div>
</div>

<script>
    // ========== PREFIX MANAGEMENT ==========
    const PREFIX_KEY = 'airline_prefixes_report';
    let airlinePrefixes = ['EK', 'FZ', 'BA', 'QR', 'SQ'];
    
    // Company info for print (matches original)
    const companyInfo = { 
        name: 'MACL', 
        address: '123 Aviation Road', 
        phone: '+123 456 7890'
    };
    
    function loadPrefixes() {
        try {
            const stored = localStorage.getItem(PREFIX_KEY);
            if (stored) {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed) && parsed.length > 0) airlinePrefixes = parsed;
            }
        } catch(e) {}
        renderPrefixes();
        updateAirlineSelect();
    }
    
    function savePrefixes() {
        localStorage.setItem(PREFIX_KEY, JSON.stringify(airlinePrefixes));
        renderPrefixes();
        updateAirlineSelect();
        filterFlights();
    }
    
    function renderPrefixes() {
        const container = document.getElementById('prefixListContainer');
        container.innerHTML = airlinePrefixes.map(p => `
            <div class="prefix-tag">
                ${p}
                <button class="remove-prefix" data-prefix="${p}">✕</button>
            </div>
        `).join('');
        document.querySelectorAll('.remove-prefix').forEach(btn => {
            btn.addEventListener('click', () => {
                if (airlinePrefixes.length > 1) {
                    airlinePrefixes = airlinePrefixes.filter(p => p !== btn.dataset.prefix);
                    savePrefixes();
                } else {
                    alert('At least one prefix required');
                }
            });
        });
    }
    
    function updateAirlineSelect() {
        const select = document.getElementById('airlineSelect');
        select.innerHTML = '<option value="">All Airlines</option>' + 
            airlinePrefixes.map(p => `<option value="${p}">${p}</option>`).join('');
    }
    
    // ========== DATA LOADING ==========
    let allReports = [];
    let currentReport = null;
    let currentPassengers = [];
    
    function getAllDatabases() {
        const dbs = [];
        if (window.baDb) dbs.push({ name: 'BA', ref: window.baDb });
        if (window.ekDb) dbs.push({ name: 'EK', ref: window.ekDb });
        if (window.qrDb) dbs.push({ name: 'QR', ref: window.qrDb });
        if (window.sqDb) dbs.push({ name: 'SQ', ref: window.sqDb });
        if (window.defaultCardDb) dbs.push({ name: 'Default', ref: window.defaultCardDb });
        if (window.db && dbs.length === 0) dbs.push({ name: 'Main', ref: window.db });
        return dbs;
    }
    
    function normalizeDate(dateStr) {
        if (!dateStr) return '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
        let parts = dateStr.split(/[/-]/);
        if (parts.length === 3) {
            if (parts[0].length === 4) return `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
            else return `${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
        }
        return dateStr;
    }
    
    function getFlightPrefix(flightNo) {
        if (!flightNo) return '';
        return flightNo.substring(0, 2).toUpperCase();
    }
    
    async function loadClosedFlights() {
        const container = document.getElementById('reportsContainer');
        container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><p>Loading closed flights from all databases...</p></div>';
        
        const databases = getAllDatabases();
        const reportsMap = new Map();
        
        for (const db of databases) {
            try {
                const snapshot = await db.ref.collection('FlightReports').where('isClosed', '==', true).get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const flightNo = data.flightNo;
                    const dateRaw = data.date;
                    const shift = data.shift || 'UNKNOWN';
                    
                    if (!flightNo || !dateRaw) return;
                    
                    const date = normalizeDate(dateRaw);
                    const key = `${date}|${flightNo}|${shift}`;
                    
                    if (!reportsMap.has(key)) {
                        reportsMap.set(key, {
                            flightNo: flightNo,
                            date: date,
                            shift: shift,
                            airline: data.airline || '',
                            std: data.std || '',
                            firstPax: data.firstPax || '',
                            lastPax: data.lastPax || '',
                            totalPax: data.totalPax || 0,
                            dbRef: db.ref,
                            dbName: db.name
                        });
                    }
                });
            } catch(err) {
                console.warn(`Error in ${db.name}:`, err);
            }
        }
        
        allReports = Array.from(reportsMap.values());
        allReports.sort((a, b) => b.date.localeCompare(a.date) || a.flightNo.localeCompare(b.flightNo));
        
        const dates = [...new Set(allReports.map(r => r.date))].sort().reverse();
        const dateSelect = document.getElementById('dateSelect');
        
        if (dates.length === 0) {
            dateSelect.innerHTML = '<option value="">-- No closed flights --</option>';
            container.innerHTML = '<div class="empty-message">No closed flights found. Please close a flight from the main page first.</div>';
        } else {
            let options = '<option value="">All Dates</option>';
            dates.forEach(d => options += `<option value="${d}">${d}</option>`);
            dateSelect.innerHTML = options;
        }
        
        filterFlights();
    }
    
    function filterFlights() {
        const selectedDate = document.getElementById('dateSelect').value;
        const selectedAirline = document.getElementById('airlineSelect').value;
        const flightSelect = document.getElementById('flightSelect');
        
        let filtered = [...allReports];
        
        if (selectedDate) {
            filtered = filtered.filter(f => f.date === selectedDate);
        }
        if (selectedAirline) {
            filtered = filtered.filter(f => getFlightPrefix(f.flightNo) === selectedAirline);
        }
        
        filtered.sort((a, b) => a.flightNo.localeCompare(b.flightNo));
        
        if (filtered.length === 0) {
            flightSelect.innerHTML = '<option value="">-- No flights --</option>';
            flightSelect.disabled = true;
            return;
        }
        
        let options = '<option value="">-- Select Flight --</option>';
        filtered.forEach(f => {
            options += `<option value="${f.flightNo}|${f.date}|${f.shift}">${f.flightNo} (${f.shift}) - ${f.totalPax || 0} pax</option>`;
        });
        flightSelect.innerHTML = options;
        flightSelect.disabled = false;
    }
    
    async function loadPassengers(flightNo, date, shift, dbRef) {
        const passengers = [];
        const possibleDates = [date];
        
        if (date.includes('-')) {
            const parts = date.split('-');
            const altDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
            possibleDates.push(altDate);
        }
        
        for (let tryDate of possibleDates) {
            try {
                const snapshot = await dbRef.collection('KoveliPass')
                    .where('date', '==', tryDate)
                    .where('flightNo', '==', flightNo)
                    .where('shift', '==', shift)
                    .get();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    passengers.push({
                        pName: data.pName || data.name || '',
                        seatNo: data.seatNo || data.seat || '',
                        pax: data.pax || (data.delayCharge ? 0 : 1),
                        FQTV: data.FQTV || '',
                        serialNo: data.serialNo || '',
                        entryTime: data.entryTime || data.time || '',
                        remarks: data.remarks || '',
                        isDelayCharge: data.delayCharge === true,
                        hiddenCode: data.hiddenCode || ''
                    });
                });
                if (passengers.length > 0) break;
            } catch(e) {}
        }
        
        const regular = passengers.filter(p => !p.isDelayCharge).sort((a,b) => (a.entryTime||'').localeCompare(b.entryTime||''));
        const delay = passengers.filter(p => p.isDelayCharge).sort((a,b) => (a.entryTime||'').localeCompare(b.entryTime||''));
        return [...regular, ...delay];
    }
    
    function extractPNR(hiddenCode) {
        if (!hiddenCode) return '';
        const lower = hiddenCode.toLowerCase();
        let match = lower.match(/([a-z0-9]{6,7})\s+mle/);
        if (match) return match[1].toUpperCase().slice(0,6);
        match = lower.match(/([a-z0-9]{6,7})mle/);
        if (match) return match[1].toUpperCase().slice(0,6);
        return '';
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    
    async function loadReport() {
        const flightSelect = document.getElementById('flightSelect');
        const selected = flightSelect.value;
        
        if (!selected) {
            alert('Please select a flight');
            return;
        }
        
        const [flightNo, date, shift] = selected.split('|');
        
        currentReport = allReports.find(r => r.flightNo === flightNo && r.date === date && r.shift === shift);
        
        if (!currentReport) {
            alert('Flight not found');
            return;
        }
        
        const container = document.getElementById('reportsContainer');
        container.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><p>Loading passengers...</p></div>';
        
        currentPassengers = await loadPassengers(flightNo, date, shift, currentReport.dbRef);
        
        const totalPax = currentPassengers.filter(p => !p.isDelayCharge).reduce((sum, p) => sum + (parseInt(p.pax) || 1), 0);
        
        document.getElementById('statsRow').style.display = 'flex';
        document.getElementById('flightStat').innerHTML = `Flight: ${flightNo}`;
        document.getElementById('paxStat').innerHTML = `Passengers: ${totalPax}`;
        
        displayReport();
    }
    
    function displayReport() {
        if (!currentReport) return;
        
        const flight = currentReport;
        const passengers = currentPassengers;
        const isFZ = flight.flightNo.toUpperCase().startsWith('FZ');
        const isSQ = flight.flightNo.toUpperCase().startsWith('SQ');
        
        const dateParts = flight.date.split('-');
        const displayDate = dateParts.length === 3 ? `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}` : flight.date;
        
        let tableHeaders = '';
        if (isFZ) {
            tableHeaders = `<tr><th>#</th><th>Name</th><th>PNR</th><th>Seat</th><th>Pax</th><th>FQTV</th><th>Serial</th><th>Time</th><th>Remarks</th></tr>`;
        } else {
            tableHeaders = `<tr><th>#</th><th>${isSQ ? 'Voucher No.' : 'Name'}</th><th>Seat</th><th>Pax</th><th>FQTV</th><th>Serial</th><th>Time</th><th>Remarks</th></tr>`;
        }
        
        let rows = '';
        passengers.forEach((p, idx) => {
            const serial = String(idx+1).padStart(3,'0');
            const rowClass = p.isDelayCharge ? 'delay-row' : '';
            const badge = p.isDelayCharge ? '<span class="delay-badge">DELAY</span>' : '';
            
            if (isFZ) {
                const pnr = extractPNR(p.hiddenCode);
                rows += `<tr class="${rowClass}">
                    <td>${serial}</td>
                    <td>${escapeHtml(p.pName) || '-'} ${badge}</td>
                    <td>${pnr || '-'}</td>
                    <td>${escapeHtml(p.seatNo) || '-'}</td>
                    <td>${p.isDelayCharge ? '0' : (p.pax || '0')}</td>
                    <td>${escapeHtml(p.FQTV) || '-'}</td>
                    <td>${escapeHtml(p.serialNo) || '—'}</td>
                    <td>${p.entryTime || '-'}</td>
                    <td>${escapeHtml(p.remarks) || '-'}</td>
                </tr>`;
            } else {
                rows += `<tr class="${rowClass}">
                    <td>${serial}</td>
                    <td>${escapeHtml(p.pName) || '-'} ${badge}</td>
                    <td>${escapeHtml(p.seatNo) || '-'}</td>
                    <td>${p.isDelayCharge ? '0' : (p.pax || '0')}</td>
                    <td>${escapeHtml(p.FQTV) || '-'}</td>
                    <td>${escapeHtml(p.serialNo) || '—'}</td>
                    <td>${p.entryTime || '-'}</td>
                    <td>${escapeHtml(p.remarks) || '-'}</td>
                </tr>`;
            }
        });
        
        const totalRegular = passengers.filter(p => !p.isDelayCharge).reduce((sum, p) => sum + (parseInt(p.pax) || 1), 0);
        
        const container = document.getElementById('reportsContainer');
        container.innerHTML = `
            <div class="report-card">
                <div class="flight-header">
                    <div>
                        <h3>✈ ${flight.flightNo} <span class="airline-tag">${flight.airline || getFlightPrefix(flight.flightNo)}</span> <span class="status-closed-badge">CLOSED</span></h3>
                        <div class="flight-meta">
                            <span>📅 ${displayDate}</span>
                            <span>⏱️ Shift: ${flight.shift}</span>
                            <span>⏰ STD: ${flight.std || '—'}</span>
                            <span>🕒 First: ${flight.firstPax || '—'}</span>
                            <span>🕒 Last: ${flight.lastPax || '—'}</span>
                            <span>👥 Total: ${totalRegular}</span>
                        </div>
                    </div>
                    <div class="status-closed-badge">READ ONLY</div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>${tableHeaders}</thead>
                        <tbody>${rows || '<tr><td colspan="9" class="empty-message">No passengers</td></tr>'}</tbody>
                    </table>
                </div>
            </div>
        `;
    }
    
    // ========== EXACT PRINT FUNCTION FROM ORIGINAL CODE ==========
    function printReport() {
        if (!currentReport || !currentPassengers) {
            alert('Please load a flight report first');
            return;
        }
        
        const flight = currentReport;
        const passengers = currentPassengers;
        const isSQ = flight.flightNo.toUpperCase().startsWith('SQ');
        const isFZ = flight.flightNo.toUpperCase().startsWith('FZ');
        
        const dateStr = flight.date;
        const dateParts = dateStr.split('-');
        const formattedDate = dateParts.length === 3 ? `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}` : dateStr;
        
        const airline = flight.airline || getFlightPrefix(flight.flightNo) || '—';
        const flightNo = flight.flightNo;
        const std = flight.std || '—';
        const firstPax = flight.firstPax || '—';
        const lastPax = flight.lastPax || '—';
        const shift = flight.shift || '—';
        
        const regularPassengers = passengers.filter(p => !p.isDelayCharge);
        const delayPassengers = passengers.filter(p => p.isDelayCharge);
        const sortedRegular = [...regularPassengers].sort((a,b) => (a.entryTime||'').localeCompare(b.entryTime||''));
        const sortedDelay = [...delayPassengers].sort((a,b) => (a.entryTime||'').localeCompare(b.entryTime||''));
        const sortedPassengers = [...sortedRegular, ...sortedDelay];
        const totalPaxSum = regularPassengers.reduce((sum, p) => sum + (parseInt(p.pax) || 1), 0);
        
        const printWindow = window.open('', '_blank');
        
        let tableHeaders = '';
        if (isFZ) {
            tableHeaders = `
                <tr>
                    <th>No.</th>
                    <th>Name</th>
                    <th>PNR</th>
                    <th>Seat</th>
                    <th>Pax</th>
                    <th>FQTV</th>
                    <th>Serial No</th>
                    <th>Time</th>
                    <th>Remarks</th>
                </tr>
            `;
        } else {
            tableHeaders = `
                <tr>
                    <th>No.</th>

        }
        
        printWindow.document.write(`

                        ${tableHeaders}
                    </thead>
                    <tbody>
        `);
        
        sortedPassengers.forEach((p, idx) => {
            const serial = String(idx+1).padStart(3,'0');
            const rowClass = p.isDelayCharge ? 'delay-charge-row' : '';
            
            if (isFZ) {
                const pnr = extractPNR(p.hiddenCode);
                printWindow.document.write(`
                    <tr class="${rowClass}">
                        <td>${serial}</td>
                        <td>${escapeHtml(p.pName) || '-'}${p.isDelayCharge ? ' (DELAY CHARGE)' : ''}</td>
                        <td>${pnr || '-'}</td>
                        <td>${escapeHtml(p.seatNo) || '-'}</td>
                        <td style="text-align:center;">${p.isDelayCharge ? '0' : (p.pax || '0')}</td>
                        <td>${escapeHtml(p.FQTV) || '-'}</td>
                        <td>${escapeHtml(p.serialNo) || '-'}</td>
                        <td>${p.entryTime || '-'}</td>
                        <td>${escapeHtml(p.remarks) || '-'}</td>
                    </tr>
                `);
            } else {
                printWindow.document.write(`
                    <tr class="${rowClass}">
                        <td>${serial}</td>
                        <td>${escapeHtml(p.pName) || '-'}${p.isDelayCharge ? ' (DELAY CHARGE)' : ''}</td>
                        <td>${escapeHtml(p.seatNo) || '-'}</td>
                        <td style="text-align:center;">${p.isDelayCharge ? '0' : (p.pax || '0')}</td>
                        <td>${escapeHtml(p.FQTV) || '-'}</td>
                        <td>${escapeHtml(p.serialNo) || '-'}</td>
                        <td>${p.entryTime || '-'}</td>

        printWindow.document.write(`
                    </tbody>

                        <div class="signature-line"></div>
                        <div class="signature-label">Checked by:</div>
                    </div>

                    window.onload = function() { window.print(); window.onafterprint = function() { window.close(); } }

        printWindow.document.close();
    }
    
    // ========== EVENT LISTENERS ==========
    document.getElementById('dateSelect').addEventListener('change', filterFlights);
    document.getElementById('airlineSelect').addEventListener('change', filterFlights);
    document.getElementById('loadBtn').addEventListener('click', loadReport);
    document.getElementById('printBtn').addEventListener('click', printReport);
    document.getElementById('refreshBtn').addEventListener('click', () => loadClosedFlights());
    document.getElementById('addPrefixBtn').addEventListener('click', () => {
        const input = document.getElementById('newPrefixInput');
        const newPrefix = input.value.trim().toUpperCase();
        if (newPrefix && /^[A-Z]{2}$/.test(newPrefix) && !airlinePrefixes.includes(newPrefix)) {
            airlinePrefixes.push(newPrefix);
            savePrefixes();
            input.value = '';
        } else if (!/^[A-Z]{2}$/.test(newPrefix)) {
            alert('Enter 2 letters (e.g., EK, FZ)');
        } else if (airlinePrefixes.includes(newPrefix)) {
            alert('Already exists');
        }
    });
    document.getElementById('resetDefaultsBtn').addEventListener('click', () => {
        airlinePrefixes = ['EK', 'FZ', 'BA', 'QR', 'SQ'];
        savePrefixes();
    });
    
    // Initialize
    loadPrefixes();
    loadClosedFlights();
</script>
