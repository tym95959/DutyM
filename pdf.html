<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0A2E3D">
    <title>ForgeStudio · Image Master</title>
    <!-- PWA manifest (inline, proper for installation) -->
    <link rel="manifest" href="data:application/manifest+json,{
        \"name\":\"ForgeStudio Image Editor\",
        \"short_name\":\"ForgeStudio\",
        \"start_url\":\".\",
        \"display\":\"standalone\",
        \"background_color\":\"#0A2E3D\",
        \"theme_color\":\"#0A2E3D\",
        \"icons\":[{
            \"src\":\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230A2E3D'/%3E%3Ctext x='50' y='67' font-size='50' text-anchor='middle' fill='white'%3EFS%3C/text%3E%3C/svg%3E\",
            \"sizes\":\"any\",
            \"type\":\"image/svg+xml\"
        }]
    }">
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0A2E3D;
            color: #F0F4F8;
            overflow-x: hidden;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* App shell */
        .app-header {
            background: rgba(10, 46, 61, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .app-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #FFD166, #FF9F1C);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .header-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }
        .badge {
            background: #1E4A5F;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .install-btn-header {
            background: #FF9F1C;
            border: none;
            color: #0A2E3D;
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            padding-bottom: 2rem;
        }

        /* Upload card */
        .upload-card {
            background: #123D4F;
            border-radius: 2rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }
        .drop-area {
            border: 2px dashed #2C6B7E;
            border-radius: 1.5rem;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .drop-area:active { background: #0E3444; }
        .btn-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            padding: 0.7rem 1.4rem;
            border-radius: 3rem;
            font-weight: 600;
            font-size: 0.85rem;
            background: #1E4A5F;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-primary {
            background: #FF9F1C;
            color: #0A2E3D;
            box-shadow: 0 2px 8px rgba(255,159,28,0.3);
        }
        .btn-primary:active { transform: scale(0.96); }
        .btn-outline {
            background: transparent;
            border: 1px solid #FF9F1C;
            color: #FF9F1C;
        }

        /* PDF toolbar */
        .pdf-bar {
            background: #123D4F;
            border-radius: 2rem;
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.6rem;
        }
        .pdf-options {
            display: flex;
            gap: 0.8rem;
            background: #0E3444;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            font-size: 0.75rem;
        }
        .pdf-options label { display: flex; align-items: center; gap: 0.3rem; }

        /* Live color panel */
        .editor-panel {
            background: #123D4F;
            border-radius: 2rem;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            display: none;
        }
        .editor-panel.active {
            display: block;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .preview-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .preview-thumb {
            width: 90px;
            height: 90px;
            border-radius: 1rem;
            object-fit: cover;
            background: #0E3444;
            border: 2px solid #FF9F1C;
        }
        .sliders {
            flex: 1;
        }
        .slider-group {
            margin-bottom: 0.7rem;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 0.2rem;
        }
        input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: #2C6B7E;
            border-radius: 5px;
        }
        input[type="range"]:focus { outline: none; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #FF9F1C;
            cursor: pointer;
        }
        .editor-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.8rem;
            justify-content: flex-end;
        }

        /* Gallery grid */
        .gallery-title {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0 0.8rem;
            font-weight: 500;
        }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }
        .image-card {
            background: #123D4F;
            border-radius: 1.3rem;
            overflow: hidden;
            transition: 0.1s;
        }
        .image-card img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }
        .card-footer {
            padding: 0.5rem;
            font-size: 0.65rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-icons {
            display: flex;
            gap: 0.3rem;
        }
        .action-icons button {
            background: #0E3444;
            border: none;
            border-radius: 2rem;
            padding: 0.3rem 0.5rem;
            color: #FFD166;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            background: #123D4F;
            border-radius: 2rem;
            color: #8CB0C0;
        }
        .status {
            background: #1E4A5F;
            border-radius: 2rem;
            padding: 0.6rem;
            text-align: center;
            font-size: 0.75rem;
            margin-top: 1rem;
        }

        /* Crop modal - fixed */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #123D4F;
            border-radius: 2rem;
            width: 92%;
            max-width: 450px;
            padding: 1rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        .modal-content img {
            width: 100%;
            border-radius: 1rem;
            display: block;
        }
        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }
        footer {
            text-align: center;
            font-size: 0.6rem;
            padding: 1rem;
            color: #5F8B9C;
        }
        @media (max-width: 500px) {
            .btn { padding: 0.6rem 1rem; font-size: 0.75rem; }
            .preview-thumb { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>
<div class="app-header">
    <h1><i class="fas fa-magic"></i> ForgeStudio</h1>
    <div class="header-actions">
        <div class="badge" id="imageCountBadge">0 images</div>
        <button id="installAppButton" class="install-btn-header" style="display: none;"><i class="fas fa-download"></i> Install</button>
    </div>
</div>
<div class="main-content">
    <div class="upload-card">
        <div id="dropZone" class="drop-area">
            <i class="fas fa-cloud-upload-alt fa-2x"></i>
            <p style="margin-top: 0.5rem;">Tap to import photos</p>
            <div class="btn-row">
                <label class="btn btn-outline"><i class="fas fa-images"></i> Gallery<input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/webp" hidden></label>
                <button id="cameraBtn" class="btn btn-outline"><i class="fas fa-camera"></i> Camera</button>
            </div>
        </div>
    </div>

    <div class="pdf-bar">
        <div class="pdf-options">
            <label><input type="checkbox" id="keepOriginalCheck"> 📐 Keep original size</label>
            <label><input type="radio" name="orientation" value="portrait" checked> Portrait</label>
            <label><input type="radio" name="orientation" value="landscape"> Landscape</label>
        </div>
        <button id="exportPdfBtn" class="btn btn-primary"><i class="fas fa-file-pdf"></i> Export PDF</button>
        <button id="clearAllBtn" class="btn"><i class="fas fa-trash"></i> Clear</button>
    </div>

    <!-- LIVE COLOR EDITOR PANEL -->
    <div id="editorPanel" class="editor-panel">
        <h4 style="margin-bottom: 0.8rem;"><i class="fas fa-palette"></i> Live color edit</h4>
        <div class="preview-row">
            <img id="livePreview" class="preview-thumb" alt="preview">
            <div class="sliders">
                <div class="slider-group"><label>Brightness <span id="brightVal">0</span></label><input type="range" id="brightness" min="-100" max="100" value="0"></div>
                <div class="slider-group"><label>Contrast <span id="contVal">0</span></label><input type="range" id="contrast" min="-100" max="100" value="0"></div>
                <div class="slider-group"><label>Saturation <span id="satVal">0</span></label><input type="range" id="saturation" min="-100" max="100" value="0"></div>
                <div class="slider-group"><label>Sepia <span id="sepiaVal">0</span></label><input type="range" id="sepia" min="0" max="100" value="0"></div>
                <div class="slider-group"><label>Grayscale <span id="grayVal">0</span></label><input type="range" id="grayscale" min="0" max="100" value="0"></div>
            </div>
        </div>
        <div class="editor-actions">
            <button id="applyColorBtn" class="btn btn-primary">✓ Apply</button>
            <button id="resetColorBtn" class="btn">↺ Reset</button>
            <button id="closeEditorBtn" class="btn">Cancel</button>
        </div>
    </div>

    <div class="gallery-title">
        <span><i class="fas fa-layer-group"></i> My images</span>
        <span id="galleryCount" style="background:#1E4A5F; padding:0.2rem 0.8rem; border-radius:2rem;">0</span>
    </div>
    <div id="galleryContainer" class="image-grid">
        <div class="empty-state"><i class="fas fa-camera-retro"></i> No images — capture or upload</div>
    </div>
    <div id="statusMsg" class="status">✨ Ready — tap any image to edit colors</div>
    <footer>✓ Crop fixed | Install as app: click Install button or browser menu → "Install app"</footer>
</div>

<!-- Crop Modal -->
<div id="cropModal" class="modal">
    <div class="modal-content">
        <img id="cropImage" src="" style="width:100%">
        <div class="modal-buttons">
            <button id="confirmCropBtn" class="btn btn-primary">✂️ Apply Crop</button>
            <button id="cancelCropBtn" class="btn">Cancel</button>
        </div>
    </div>
</div>

<script>
    // ======================= STATE =======================
    let images = [];          // { id, dataURL, name, width, height, mimeType, filters }
    let nextId = 1;
    let selectedImageId = null;
    let activeCropper = null;
    let currentCropId = null;
    let originalDataURL = null;
    let deferredPrompt = null;

    // DOM elements
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const cameraBtn = document.getElementById('cameraBtn');
    const galleryDiv = document.getElementById('galleryContainer');
    const exportBtn = document.getElementById('exportPdfBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const keepOriginalCheck = document.getElementById('keepOriginalCheck');
    const editorPanel = document.getElementById('editorPanel');
    const livePreview = document.getElementById('livePreview');
    const brightness = document.getElementById('brightness');
    const contrast = document.getElementById('contrast');
    const saturation = document.getElementById('saturation');
    const sepia = document.getElementById('sepia');
    const grayscale = document.getElementById('grayscale');
    const brightVal = document.getElementById('brightVal');
    const contVal = document.getElementById('contVal');
    const satVal = document.getElementById('satVal');
    const sepiaVal = document.getElementById('sepiaVal');
    const grayVal = document.getElementById('grayVal');
    const applyColorBtn = document.getElementById('applyColorBtn');
    const resetColorBtn = document.getElementById('resetColorBtn');
    const closeEditorBtn = document.getElementById('closeEditorBtn');
    const statusDiv = document.getElementById('statusMsg');
    const galleryCountSpan = document.getElementById('galleryCount');
    const imageCountBadge = document.getElementById('imageCountBadge');
    const installButton = document.getElementById('installAppButton');

    // ======================= PWA INSTALL LOGIC =======================
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installButton.style.display = 'flex';
    });
    installButton.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installButton.style.display = 'none';
                setStatus('App installed successfully!', false);
            }
            deferredPrompt = null;
        } else {
            setStatus('Installation not available right now. Use browser menu → Install app.', true);
        }
    });
    window.addEventListener('appinstalled', () => {
        installButton.style.display = 'none';
        setStatus('ForgeStudio is now installed as an app!', false);
    });

    // ======================= HELPERS =======================
    function setStatus(msg, isErr = false) {
        statusDiv.innerHTML = `<i class="fas ${isErr ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${msg}`;
        statusDiv.style.background = isErr ? '#6B2E2E' : '#1E4A5F';
        setTimeout(() => {
            if (statusDiv.innerHTML.includes(msg)) statusDiv.style.background = '#1E4A5F';
        }, 2500);
    }

    function loadImageFromURL(dataURL) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = dataURL;
        });
    }

    // ======================= COLOR FILTERS =======================
    async function applyFiltersToImage(dataURL, filters) {
        const img = await loadImageFromURL(dataURL);
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        const b = filters.brightness || 0;
        const c = (filters.contrast || 0) / 100;
        const s = (filters.saturation || 0) / 100;
        const sep = (filters.sepia || 0) / 100;
        const gray = (filters.grayscale || 0) / 100;
        for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], bl = data[i+2];
            r += b * 2.55; g += b * 2.55; bl += b * 2.55;
            const factor = (259 * (c + 255)) / (255 * (259 - c));
            r = factor * (r - 128) + 128; g = factor * (g - 128) + 128; bl = factor * (bl - 128) + 128;
            const grayVal = 0.2989 * r + 0.5870 * g + 0.1140 * bl;
            r = grayVal + (r - grayVal) * (1 + s);
            g = grayVal + (g - grayVal) * (1 + s);
            bl = grayVal + (bl - grayVal) * (1 + s);
            if (sep > 0) {
                const tr = r, tg = g, tb = bl;
                r = (tr * 0.393 + tg * 0.769 + tb * 0.189) * sep + tr * (1 - sep);
                g = (tr * 0.349 + tg * 0.686 + tb * 0.168) * sep + tg * (1 - sep);
                bl = (tr * 0.272 + tg * 0.534 + tb * 0.131) * sep + tb * (1 - sep);
            }
            if (gray > 0) {
                const grayMix = r * 0.3 + g * 0.59 + bl * 0.11;
                r = r * (1 - gray) + grayMix * gray;
                g = g * (1 - gray) + grayMix * gray;
                bl = bl * (1 - gray) + grayMix * gray;
            }
            data[i] = Math.min(255, Math.max(0, r));
            data[i+1] = Math.min(255, Math.max(0, g));
            data[i+2] = Math.min(255, Math.max(0, bl));
        }
        ctx.putImageData(imageData, 0, 0);
        return canvas.toDataURL('image/jpeg', 0.92);
    }

    // ======================= RENDER GALLERY =======================
    async function renderGallery() {
        galleryCountSpan.innerText = images.length;
        imageCountBadge.innerText = `${images.length} image${images.length !== 1 ? 's' : ''}`;
        if (images.length === 0) {
            galleryDiv.innerHTML = `<div class="empty-state"><i class="fas fa-camera-retro"></i> No images — capture or upload</div>`;
            return;
        }
        galleryDiv.innerHTML = '';
        for (let i = 0; i < images.length; i++) {
            const img = images[i];
            const card = document.createElement('div'); card.className = 'image-card';
            const thumb = document.createElement('img'); thumb.src = img.dataURL; thumb.alt = img.name;
            thumb.addEventListener('click', () => openColorEditor(img.id));
            const footer = document.createElement('div'); footer.className = 'card-footer';
            footer.innerHTML = `<span>${img.width}×${img.height}</span><div class="action-icons"></div>`;
            const actions = footer.querySelector('.action-icons');
            const rotLeft = document.createElement('button'); rotLeft.innerHTML = '<i class="fas fa-undo-alt"></i>'; rotLeft.onclick = (e) => { e.stopPropagation(); rotateImage(img.id, -90); };
            const rotRight = document.createElement('button'); rotRight.innerHTML = '<i class="fas fa-redo-alt"></i>'; rotRight.onclick = (e) => { e.stopPropagation(); rotateImage(img.id, 90); };
            const cropBtn = document.createElement('button'); cropBtn.innerHTML = '<i class="fas fa-crop"></i>'; cropBtn.onclick = (e) => { e.stopPropagation(); openCropModal(img.id); };
            const colorBtn = document.createElement('button'); colorBtn.innerHTML = '<i class="fas fa-palette"></i>'; colorBtn.onclick = (e) => { e.stopPropagation(); openColorEditor(img.id); };
            const delBtn = document.createElement('button'); delBtn.innerHTML = '<i class="fas fa-trash"></i>'; delBtn.style.background = '#5E2E2E'; delBtn.onclick = (e) => { e.stopPropagation(); removeImage(img.id); };
            actions.append(rotLeft, rotRight, cropBtn, colorBtn, delBtn);
            card.append(thumb, footer);
            galleryDiv.appendChild(card);
        }
    }

    async function rotateImage(id, deg) {
        const idx = images.findIndex(i => i.id === id);
        if (idx === -1) return;
        const img = images[idx];
        const loaded = await loadImageFromURL(img.dataURL);
        const w = loaded.width, h = loaded.height;
        const canvas = document.createElement('canvas');
        let newW = w, newH = h, rad = 0;
        if (deg === 90) { newW = h; newH = w; rad = Math.PI/2; }
        else if (deg === -90) { newW = h; newH = w; rad = -Math.PI/2; }
        else if (deg === 180) rad = Math.PI;
        canvas.width = newW; canvas.height = newH;
        const ctx = canvas.getContext('2d');
        if (deg === 90) { ctx.translate(newW, 0); ctx.rotate(rad); }
        else if (deg === -90) { ctx.translate(0, newH); ctx.rotate(rad); }
        else if (deg === 180) { ctx.translate(w, h); ctx.rotate(rad); }
        ctx.drawImage(loaded, 0, 0);
        const newURL = canvas.toDataURL(img.mimeType || 'image/jpeg', 0.95);
        images[idx] = { ...img, dataURL: newURL, width: canvas.width, height: canvas.height };
        renderGallery(); setStatus(`Rotated ${img.name}`);
    }

    function removeImage(id) {
        images = images.filter(i => i.id !== id);
        if (selectedImageId === id) closeEditor();
        renderGallery(); setStatus('Image removed');
    }

    // ======================= LIVE COLOR EDITOR =======================
    let editorTimeout = null;
    async function updateLivePreview() {
        if (!selectedImageId || !originalDataURL) return;
        const filters = {
            brightness: parseInt(brightness.value),
            contrast: parseInt(contrast.value),
            saturation: parseInt(saturation.value),
            sepia: parseInt(sepia.value),
            grayscale: parseInt(grayscale.value)
        };
        const newPreview = await applyFiltersToImage(originalDataURL, filters);
        livePreview.src = newPreview;
    }
    function debouncedUpdate() { if (editorTimeout) clearTimeout(editorTimeout); editorTimeout = setTimeout(updateLivePreview, 50); }
    function attachSliderEvents() {
        [brightness, contrast, saturation, sepia, grayscale].forEach(sl => {
            sl.removeEventListener('input', debouncedUpdate);
            sl.addEventListener('input', debouncedUpdate);
            sl.addEventListener('input', () => {
                brightVal.innerText = brightness.value;
                contVal.innerText = contrast.value;
                satVal.innerText = saturation.value;
                sepiaVal.innerText = sepia.value;
                grayVal.innerText = grayscale.value;
            });
        });
    }

    async function openColorEditor(id) {
        const img = images.find(i => i.id === id);
        if (!img) return;
        selectedImageId = id;
        originalDataURL = img.dataURL;
        const f = img.filters || { brightness:0, contrast:0, saturation:0, sepia:0, grayscale:0 };
        brightness.value = f.brightness; brightVal.innerText = f.brightness;
        contrast.value = f.contrast; contVal.innerText = f.contrast;
        saturation.value = f.saturation; satVal.innerText = f.saturation;
        sepia.value = f.sepia; sepiaVal.innerText = f.sepia;
        grayscale.value = f.grayscale; grayVal.innerText = f.grayscale;
        const preview = await applyFiltersToImage(originalDataURL, f);
        livePreview.src = preview;
        editorPanel.classList.add('active');
        attachSliderEvents();
    }
    function closeEditor() { editorPanel.classList.remove('active'); selectedImageId = null; originalDataURL = null; }
    async function applyColor() {
        if (!selectedImageId) return;
        const idx = images.findIndex(i => i.id === selectedImageId);
        if (idx === -1) { closeEditor(); return; }
        const filters = {
            brightness: parseInt(brightness.value),
            contrast: parseInt(contrast.value),
            saturation: parseInt(saturation.value),
            sepia: parseInt(sepia.value),
            grayscale: parseInt(grayscale.value)
        };
        const newURL = await applyFiltersToImage(originalDataURL, filters);
        images[idx] = { ...images[idx], dataURL: newURL, filters };
        renderGallery(); setStatus('Color applied');
        closeEditor();
    }
    function resetSliders() {
        brightness.value = 0; contrast.value = 0; saturation.value = 0; sepia.value = 0; grayscale.value = 0;
        brightVal.innerText = 0; contVal.innerText = 0; satVal.innerText = 0; sepiaVal.innerText = 0; grayVal.innerText = 0;
        updateLivePreview();
    }
    applyColorBtn.onclick = applyColor;
    resetColorBtn.onclick = resetSliders;
    closeEditorBtn.onclick = closeEditor;

    // ======================= CROP (FIXED) =======================
    async function openCropModal(id) {
        const img = images.find(i => i.id === id);
        if (!img) return;
        currentCropId = id;
        const modal = document.getElementById('cropModal');
        const modalImg = document.getElementById('cropImage');
        modalImg.src = img.dataURL;
        modal.style.display = 'flex';
        
        // Wait for image to load before initializing cropper
        if (activeCropper) activeCropper.destroy();
        modalImg.onload = () => {
            activeCropper = new Cropper(modalImg, {
                viewMode: 1,
                autoCropArea: 0.8,
                background: true,
                responsive: true,
                checkOrientation: false
            });
        };
        if (modalImg.complete) modalImg.onload();
    }
    async function applyCrop() {
        if (!activeCropper || !currentCropId) return;
        const croppedCanvas = activeCropper.getCroppedCanvas();
        if (!croppedCanvas) return;
        const croppedURL = croppedCanvas.toDataURL('image/jpeg', 0.95);
        const idx = images.findIndex(i => i.id === currentCropId);
        if (idx !== -1) {
            images[idx] = { ...images[idx], dataURL: croppedURL, width: croppedCanvas.width, height: croppedCanvas.height, filters: {} };
            renderGallery(); setStatus('Cropped');
        }
        closeCropModal();
    }
    function closeCropModal() {
        if (activeCropper) activeCropper.destroy();
        document.getElementById('cropModal').style.display = 'none';
        currentCropId = null;
    }
    document.getElementById('confirmCropBtn').onclick = applyCrop;
    document.getElementById('cancelCropBtn').onclick = closeCropModal;

    // ======================= CAMERA & FILE IMPORT =======================
    cameraBtn.onclick = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.createElement('video');
            video.srcObject = stream; video.setAttribute('playsinline', true); video.play();
            const canvas = document.createElement('canvas');
            const capture = () => {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                stream.getTracks().forEach(t => t.stop());
                addFromDataURL(canvas.toDataURL('image/jpeg', 0.92), `camera_${Date.now()}.jpg`);
            };
            setStatus('Capturing in 1 sec...'); setTimeout(capture, 1000);
        } catch(e) { setStatus('Camera error: ' + e.message, true); }
    };
    async function addFromDataURL(dataURL, filename) {
        const img = await loadImageFromURL(dataURL);
        images.push({ id: nextId++, dataURL, name: filename, width: img.width, height: img.height, mimeType: 'image/jpeg', filters: { brightness:0, contrast:0, saturation:0, sepia:0, grayscale:0 } });
        renderGallery(); setStatus(`Added ${filename}`);
    }
    async function addFiles(files) {
        const valid = Array.from(files).filter(f => f.type.startsWith('image/'));
        if (!valid.length) { setStatus('No valid images', true); return; }
        for (let file of valid) {
            const dataURL = await new Promise(resolve => { const reader = new FileReader(); reader.onload = e => resolve(e.target.result); reader.readAsDataURL(file); });
            const img = await loadImageFromURL(dataURL);
            images.push({ id: nextId++, dataURL, name: file.name, width: img.width, height: img.height, mimeType: file.type, filters: { brightness:0, contrast:0, saturation:0, sepia:0, grayscale:0 } });
        }
        renderGallery(); setStatus(`Added ${valid.length} image(s)`);
    }

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => addFiles(e.target.files));
    dropZone.addEventListener('dragover', e => e.preventDefault());
    dropZone.addEventListener('drop', e => { e.preventDefault(); addFiles(e.dataTransfer.files); });
    clearAllBtn.onclick = () => { images = []; renderGallery(); setStatus('All cleared'); };

    // ======================= PDF EXPORT (no shrinking) =======================
    async function exportPDF() {
        if (images.length === 0) { setStatus('No images', true); return; }
        const orientation = document.querySelector('input[name="orientation"]:checked').value;
        const keepOriginal = keepOriginalCheck.checked;
        const { jsPDF } = window.jspdf;
        let pdf = null;
        const pageW = orientation === 'portrait' ? 210 : 297, pageH = orientation === 'portrait' ? 297 : 210;
        const margin = 8, bottomSpace = 12, usableW = pageW - margin*2, usableH = pageH - margin - bottomSpace;
        const pxToMM = (px) => px * 25.4 / 96;
        for (let i = 0; i < images.length; i++) {
            const img = images[i];
            const imgEl = await loadImageFromURL(img.dataURL);
            let wmm, hmm, x, y;
            if (keepOriginal) {
                wmm = pxToMM(imgEl.width); hmm = pxToMM(imgEl.height);
                x = margin + (usableW - wmm)/2; y = margin + (usableH - hmm)/2;
                x = Math.max(margin - wmm + 2, Math.min(margin+usableW-2, x));
                y = Math.max(margin - hmm + 2, Math.min(margin+usableH-2, y));
            } else {
                const aspect = imgEl.width/imgEl.height;
                let targetW = usableW, targetH = targetW/aspect;
                if (targetH > usableH) { targetH = usableH; targetW = targetH * aspect; }
                wmm = targetW; hmm = targetH;
                x = margin + (usableW - wmm)/2; y = margin + (usableH - hmm)/2;
            }
            if (i === 0) pdf = new jsPDF({ orientation, unit: 'mm', format: 'a4' });
            else pdf.addPage();
            let format = img.mimeType === 'image/png' ? 'PNG' : 'JPEG';
            try { pdf.addImage(img.dataURL, format, x, y, wmm, hmm); } catch(e) { pdf.text(`Error: ${img.name}`, margin+2, margin+10); }
            pdf.setFontSize(8); pdf.text(`${img.name} (${i+1}/${images.length})`, pageW/2, pageH-4, { align: 'center' });
        }
        if (pdf) { pdf.save(`forgestudio_${Date.now()}.pdf`); setStatus('PDF exported!'); }
        else setStatus('PDF failed', true);
    }
    exportBtn.onclick = exportPDF;

    // ======================= SERVICE WORKER FOR INSTALLABILITY =======================
    if ('serviceWorker' in navigator) {
        const swCode = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));`;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).then(reg => console.log('SW registered')).catch(err => console.warn('SW error', err));
    }
    renderGallery();
    setStatus('Ready — tap any image to edit colors, crop works perfectly');
</script>
</body>
