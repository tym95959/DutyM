<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Aetheris Flight Ops | Manifest & Delay Manager</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <!-- External config files (assumed to exist) -->
    <script src="fireshift.js"></script>
    <script src="Co.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f8f6f0;
            padding: 20px;
            color: #1e2a2f;
        }
        .container {
            max-width: 1480px;
            margin: 0 auto;
        }
        /* modern card & ribbon */
        .shift-ribbon {
            background: linear-gradient(105deg, #a6791e 0%, #e6b422 100%);
            border-radius: 60px;
            padding: 8px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
            color: white;
            font-weight: 500;
        }
        .shift-badge {
            background: rgba(0,0,0,0.2);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
        }
        .refresh-shift, .clear-cache-btn {
            background: rgba(255,255,240,0.2);
            border: none;
            backdrop-filter: blur(4px);
            padding: 5px 18px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            margin-left: 8px;
            font-size: 12px;
        }
        .refresh-shift:hover, .clear-cache-btn:hover {
            background: rgba(255,255,240,0.4);
        }
        .card {
            background: white;
            border-radius: 32px;
            padding: 20px 28px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
            border: 1px solid #f0e2bc;
            margin-bottom: 28px;
        }
        .selection-flight-row {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 180px;
        }
        .form-group label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #b88b2c;
            letter-spacing: 0.5px;
        }
        .form-control {
            padding: 10px 14px;
            border-radius: 24px;
            border: 1.5px solid #eedba7;
            background: white;
            font-size: 14px;
            transition: 0.2s;
            cursor: pointer;
        }
        .quick-shift-box {
            background: #fef7e8;
            padding: 0 24px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid #e6b422;
            color: #8b5e14;
        }
        .database-badge {
            background: #2c5f7a;
            padding: 4px 12px;
            border-radius: 32px;
            font-size: 10px;
            font-weight: 600;
            color: white;
        }
        .flight-panel-revised {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-top: 8px;
        }
        .left-details-block {
            background: #fffbf0;
            border-radius: 24px;
            padding: 16px 20px;
            border-left: 5px solid #e6b422;
        }
        .info-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 10px 20px;
            font-size: 13px;
        }
        .stats-mini {
            display: flex;
            gap: 20px;
            background: white;
            padding: 12px 16px;
            border-radius: 28px;
            margin-top: 16px;
            justify-content: space-around;
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-size: 22px;
            font-weight: 800;
            color: #a46f1c;
        }
        .right-ops-block {
            background: white;
            border-radius: 24px;
            padding: 16px 20px;
            border: 1px solid #f0e0bc;
        }
        .ops-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 14px 18px;
            font-size: 13px;
        }
        .edit-field {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .edit-input {
            padding: 6px 10px;
            border-radius: 40px;
            border: 1px solid #e6b422;
            font-size: 12px;
        }
        .edit-btn {
            background: #e6b422;
            border: none;
            border-radius: 40px;
            padding: 5px 14px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
        }
        .action-buttons-vertical {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
            border-top: 1px dashed #eedba7;
            padding-top: 18px;
        }
        .close-btn, .reopen-btn, .print-btn, .delay-charge-btn {
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 12px;
            border: none;
            cursor: pointer;
            flex: 1;
        }
        .close-btn { background: #c16f3e; color: white; }
        .reopen-btn { background: #6f8f2d; color: white; }
        .print-btn { background: #2c5f7a; color: white; }
        .delay-charge-btn { background: #b13e3e; color: white; }
        .flight-status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-open { background: #6f8f2d20; color: #4b6e1a; border:1px solid #6f8f2d; }
        .status-closed { background: #a5632e20; color: #a5632e; border:1px solid #a5632e; }
        /* table */
        .table-container {
            background: white;
            border-radius: 28px;
            border: 1px solid #eedba7;
            overflow: hidden;
            margin-top: 12px;
        }
        .table-header {
            background: #fef6e6;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e6b422;
        }
        .table-wrapper {
            overflow-x: auto;
            max-height: 550px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
        }
        th {
            background: #e6b422;
            color: #2c2b26;
            padding: 12px 10px;
            position: sticky;
            top: 0;
            font-weight: 700;
        }
        td {
            padding: 10px 8px;
            border-bottom: 1px solid #f0e2c0;
        }
        .serial-no {
            font-family: monospace;
            font-weight: 600;
            color: #c47c2e;
        }
        .table-action-btn {
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 600;
            border: none;
            margin: 2px;
            cursor: pointer;
        }
        .edit-table-btn { background: #e6b42220; color: #a46f1c; }
        .delete-table-btn { background: #b13e3e20; color: #b13e3e; }
        .save-table-btn { background: #6f8f2d; color: white; }
        .duplicate-warning-banner {
            background: #fff0db;
            border-left: 6px solid #e6b422;
            padding: 12px 20px;
            margin: 12px;
            border-radius: 24px;
            font-size: 12px;
        }
        .delay-charge-row {
            background: #fef1e6;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            width: 95%;
            max-width: 1100px;
            border-radius: 32px;
            padding: 24px;
            max-height: 85vh;
            overflow-y: auto;
            border-top: 8px solid #e6b422;
        }
        .passenger-item {
            display: grid;
            grid-template-columns: 50px 1fr 110px 110px 70px 120px;
            gap: 12px;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .filter-btn {
            background: #e6b422;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 600;
        }
        @media print {
            body { background: white; padding: 0; }
            .shift-ribbon, .action-buttons-vertical, .edit-btn, .table-action-btn, .refresh-shift, .clear-cache-btn { display: none; }
            .card { box-shadow: none; border: 1px solid #ccc; }
        }
        .order-badge {
            background: #2c5f7a;
            color: white;
            border-radius: 20px;
            font-size: 9px;
            padding: 2px 8px;
            margin-left: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="shift-ribbon">
        <div><span class="shift-badge" id="shiftBadge">LOADING...</span><span id="ribbonDate" style="margin-left:12px;">--</span></div>
        <div><button class="refresh-shift" onclick="fetchOpenShift()">⟳ REFRESH</button><button class="clear-cache-btn" onclick="clearDateCache()">🗑 CACHE</button></div>
    </div>
    <div class="card">
        <div class="selection-flight-row">
            <div class="form-group"><label>📅 DATE</label><select id="dateSelect" class="form-control" onclick="if(!window.datesLoaded) scanDatesAndFlights()" onchange="onDateSelected()"><option value="">-- Load dates --</option></select></div>
            <div class="form-group"><label>✈ FLIGHT</label><select id="flightSelect" class="form-control" onchange="onFlightSelected()" disabled><option value="">Select date first</option></select></div>
            <div class="quick-shift-box"><span id="quickShiftText">Choose flight</span><span id="databaseBadge" class="database-badge" style="display:none;"></span></div>
        </div>
        <div id="flightPanel" style="display:none;">
            <div class="flight-panel-revised">
                <div class="left-details-block">
                    <div class="info-grid"><span class="info-label">Airline:</span><span id="airlineDisplay">-</span><span class="info-label">Flight:</span><span id="flightNoDisplay">-</span><span class="info-label">Date:</span><span id="dateDisplay">-</span><span class="info-label">Database:</span><span id="databaseDisplay">-</span><span class="info-label">Status:</span><span id="flightStatus" class="flight-status status-open">OPEN</span></div>
                    <div class="stats-mini"><div class="stat-item"><div class="stat-label">Total Pax</div><div class="stat-number" id="totalPaxStat">0</div></div><div class="stat-item"><div class="stat-label">First Pax</div><div class="stat-number" id="firstPaxStat">--:--</div></div><div class="stat-item"><div class="stat-label">Last Pax</div><div class="stat-number" id="lastPaxStat">--:--</div></div></div>
                </div>
                <div class="right-ops-block">
                    <div class="ops-grid"><span class="ops-label">Shift:</span><span id="shiftDisplay">-</span><span class="ops-label">STD:</span><div class="edit-field"><input type="time" id="stdInput" class="edit-input" onchange="updateSTD()"><button class="edit-btn" onclick="updateSTD()">Update</button></div><span class="ops-label">Last Pax Time:</span><div class="edit-field"><input type="time" id="lastPaxInput" class="edit-input" onchange="updateLastPax()"><button class="edit-btn" onclick="updateLastPax()">Set</button></div></div>
                    <div class="action-buttons-vertical"><button id="closeFlightBtn" class="close-btn" onclick="closeFlight()" disabled>🔒 CLOSE</button><button id="reopenFlightBtn" class="reopen-btn" onclick="reopenFlight()" style="display:none;">🔓 REOPEN</button><button id="printReportBtn" class="print-btn" onclick="printReport()" disabled>🖨️ PRINT</button><button id="delayChargeBtn" class="delay-charge-btn" onclick="openDelayChargeModal()" disabled>⏱️ DELAY CHARGE</button></div>
                    <div id="flightClosedMessage" class="flight-closed-message" style="display:none; background:#f0e0bc; border-radius:30px; padding:6px 12px; margin-top:8px; text-align:center;">⚠️ Flight CLOSED — no modifications</div>
                </div>
            </div>
        </div>
    </div>
    <div id="tableContainer" class="table-container" style="display:none;"><div class="table-header"><h3>✈ PASSENGER MANIFEST <span style="font-size:11px;">(sorted by save order)</span></h3><span class="passenger-count" id="passengerCount">0</span></div><div class="table-wrapper"><table><thead id="tableHeader"></thead><tbody id="passengerTableBody"><tr><td colspan="10" class="no-data">Select flight</td></tr></tbody></table></div></div>
</div>
<div id="delayChargeModal" class="modal"><div class="modal-content"><div class="modal-header" style="display:flex; justify-content:space-between;"><h2>⏰ DELAY CHARGE</h2><span class="close-modal" onclick="closeDelayChargeModal()" style="font-size:28px; cursor:pointer;">&times;</span></div><div class="flight-select-section"><select id="delayFlightSelect" class="form-control" onchange="onDelayFlightSelected()"></select><input type="time" id="globalLastPax" placeholder="Set all last pax" onchange="updateAllLastPax()"></div><div id="passengerListContainer" style="display:none;"><div id="passengerList" class="passenger-list"></div><div><button class="filter-btn" onclick="calculateDelayCharges()">Calculate</button><button class="filter-btn" onclick="submitDelayCharges()">Submit Charges</button></div><div id="chargeSummary"></div></div><div id="noFlightSelectedMessage" style="padding:30px;">Select flight</div></div></div>
<script>
    // GLOBALS
    let flightsByDate = {};
    let allDates = [];
    let currentFlightData = null;
    let currentDatabase = null;
    let editingRowId = null;
    let datesLoaded = false;
    let isLoadingDates = false;
    const CACHE_KEY = 'flightDateCacheV2';
    const CACHE_DURATION = 3600000;

    // Helper: get current logged user (like second code)
    function getCurrentUser() { return localStorage.getItem('name') || localStorage.getItem('username') || 'Operator'; }

    // Multi-database helpers
    function getFirestoreForFlight(flightNo) { let p = flightNo?.substring(0,2).toUpperCase(); if(p==='BA') return window.baDb; if(p==='EK') return window.ekDb; if(p==='QR') return window.qrDb; if(p==='SQ') return window.sqDb; return window.defaultCardDb; }
    function getAllDatabases() { let dbs=[]; if(window.baDb) dbs.push({name:'BA Database',ref:window.baDb}); if(window.ekDb) dbs.push({name:'EK Database',ref:window.ekDb}); if(window.qrDb) dbs.push({name:'QR Database',ref:window.qrDb}); if(window.sqDb) dbs.push({name:'SQ Database',ref:window.sqDb}); if(window.defaultCardDb) dbs.push({name:'Default Database',ref:window.defaultCardDb}); return dbs; }

    // CACHE
    function saveCache() { try { let cacheable = {}; for(let d in flightsByDate){ cacheable[d] = Array.from(flightsByDate[d].entries()); } localStorage.setItem(CACHE_KEY, JSON.stringify({flightsByDate:cacheable, allDates, timestamp:Date.now()})); } catch(e){} }
    function loadCache(){ let raw = localStorage.getItem(CACHE_KEY); if(!raw) return false; let data = JSON.parse(raw); if(Date.now() - data.timestamp > CACHE_DURATION) return false; flightsByDate = {}; for(let d in data.flightsByDate){ flightsByDate[d] = new Map(data.flightsByDate[d]); } allDates = data.allDates; datesLoaded = true; return true; }
    function clearDateCache(){ localStorage.removeItem(CACHE_KEY); flightsByDate={}; allDates=[]; datesLoaded=false; document.getElementById('dateSelect').innerHTML='<option value="">-- Click to load --</option>'; document.getElementById('flightSelect').disabled=true; document.getElementById('flightPanel').style.display='none'; document.getElementById('tableContainer').style.display='none'; scanDatesAndFlights(true); }

    // SCAN ONLY METADATA
    async function scanDatesAndFlights(force=false) {
        if(datesLoaded && !force) { populateDateDropdown(); return; }
        if(isLoadingDates) return;
        isLoadingDates = true;
        if(!force && loadCache()) { populateDateDropdown(); isLoadingDates=false; return; }
        flightsByDate = {}; allDates = [];
        let dbs = getAllDatabases();
        for(let dbInfo of dbs) {
            try {
                let snap = await dbInfo.ref.collection('KoveliPass').select('date','flightNo','shift','airline','pax','delayCharge').limit(8000).get();
                snap.forEach(doc=>{
                    let d = doc.data();
                    let date = d.date, flightNo = d.flightNo, shift = d.shift || 'UNKNOWN';
                    if(!date || !flightNo) return;
                    let key = `${date}_${flightNo}_${shift}`;
                    if(!flightsByDate[date]) flightsByDate[date] = new Map();
                    if(!flightsByDate[date].has(key)) {
                        flightsByDate[date].set(key, { flightNo, shift, airline: d.airline || '', paxCount: (!d.delayCharge ? (parseInt(d.pax)||0) : 0), database: dbInfo.name, dbRef: dbInfo.ref });
                    } else {
                        let existing = flightsByDate[date].get(key);
                        if(!d.delayCharge) existing.paxCount += (parseInt(d.pax)||0);
                    }
                });
            } catch(e){ console.warn(e); }
        }
        allDates = Object.keys(flightsByDate).sort().reverse();
        datesLoaded = true;
        saveCache();
        populateDateDropdown();
        isLoadingDates = false;
    }
    function populateDateDropdown(){ let sel = document.getElementById('dateSelect'); if(allDates.length===0) sel.innerHTML='<option>❌ No dates</option>'; else { let opts = '<option value="">📅 Select date</option>'; allDates.forEach(d=>{ opts+=`<option value="${d}">${d} (${flightsByDate[d]?.size||0} flights)</option>`; }); sel.innerHTML=opts; } sel.disabled=false; }

    async function onDateSelected(){ let date = document.getElementById('dateSelect').value; let flightSel = document.getElementById('flightSelect'); if(!date){ flightSel.innerHTML='<option>--Select date--</option>'; flightSel.disabled=true; document.getElementById('flightPanel').style.display='none'; return; } let flights = flightsByDate[date]; if(!flights || flights.size===0){ flightSel.innerHTML='<option>No flights</option>'; flightSel.disabled=false; return; } let opts = '<option value="">✈️ Select flight</option>'; for(let [k,f] of flights.entries()){ opts+=`<option value="${f.flightNo}|${f.shift}|${f.database}">${f.flightNo} [${f.shift}] - ${f.paxCount} pax</option>`; } flightSel.innerHTML=opts; flightSel.disabled=false; document.getElementById('flightPanel').style.display='none'; document.getElementById('tableContainer').style.display='none'; }

    async function onFlightSelected(){
        let date = document.getElementById('dateSelect').value;
        let val = document.getElementById('flightSelect').value;
        if(!date || !val) return;
        let [flightNo, shift, dbName] = val.split('|');
        let flightInfo = flightsByDate[date]?.get(`${flightNo}_${shift}`);
        if(!flightInfo) return;
        let targetDb = flightInfo.dbRef || getFirestoreForFlight(flightNo);
        try {
            let snapshot = await targetDb.collection('KoveliPass').where('date','==',date).where('flightNo','==',flightNo).where('shift','==',shift).get();
            let passengers = [];
            let firstPax=null, lastPax=null, totalPaxSum=0;
            snapshot.forEach(doc=>{
                let data = doc.data();
                let isDelay = data.delayCharge || false;
                let paxVal = isDelay ? 0 : (parseInt(data.pax)||1);
                let passenger = { docId:doc.id, pName:data.pName||data.name||'', seatNo:data.seatNo||'', pax:paxVal, FQTV:data.FQTV||'', entryTime:data.entryTime||data.time||'', remarks:data.remarks||'', serialNo:data.serialNo||'', hiddenCode:data.hiddenCode||'', isDelayCharge:isDelay, isGuest:data.isGuest||false, createdAt: data.createdAt || data.timestamp || null };
                // capture firestore timestamp for ordering
                if(data.createdAt) passenger.createdAt = data.createdAt;
                else if(data.timestamp) passenger.createdAt = data.timestamp;
                passengers.push(passenger);
                if(!isDelay) { totalPaxSum += paxVal; if(data.entryTime){ if(!firstPax || data.entryTime < firstPax) firstPax = data.entryTime; if(!lastPax || data.entryTime > lastPax) lastPax = data.entryTime; } }
            });
            // SORT BY SAVE ORDER: createdAt timestamp first, then entryTime as tie-breaker
            passengers.sort((a,b)=> {
                let timeA = a.createdAt ? (a.createdAt.seconds || a.createdAt) : 0;
                let timeB = b.createdAt ? (b.createdAt.seconds || b.createdAt) : 0;
                if(timeA && timeB && timeA !== timeB) return timeA - timeB;
                // fallback to entryTime for same millisecond saves
                return (a.entryTime || '').localeCompare(b.entryTime || '');
            });
            currentFlightData = { ...flightInfo, date, passengers, firstPax, lastPax, totalPax:totalPaxSum, isClosed:false, std:'', shift:shift };
            currentDatabase = targetDb;
            let formattedDate = date.replace(/\//g,'-');
            let reportId = `${flightNo}_${formattedDate}`;
            try{ let repDoc = await targetDb.collection('FlightReports').doc(reportId).get(); if(repDoc.exists){ let rd=repDoc.data(); currentFlightData.isClosed=rd.isClosed||false; currentFlightData.std=rd.std||''; currentFlightData.lastPax=rd.lastPax||''; } }catch(e){}
            updateFlightUI(flightInfo,date,flightNo,shift);
        } catch(err){ console.error(err); document.getElementById('passengerTableBody').innerHTML='<tr><td>Error loading data</td></tr>'; }
    }
    function updateFlightUI(flightInfo,date,flightNo,shift){
        document.getElementById('airlineDisplay').innerText=flightInfo.airline||'-'; document.getElementById('flightNoDisplay').innerText=flightNo; document.getElementById('dateDisplay').innerText=date; document.getElementById('shiftDisplay').innerText=shift; document.getElementById('databaseDisplay').innerText=flightInfo.database; document.getElementById('databaseBadge').style.display='inline-block'; document.getElementById('databaseBadge').innerText=flightInfo.database;
        document.getElementById('firstPaxDisplay').innerText=currentFlightData.firstPax||'-'; document.getElementById('lastPaxInput').value=currentFlightData.lastPax||''; document.getElementById('stdInput').value=currentFlightData.std||''; document.getElementById('totalPaxStat').innerText=currentFlightData.totalPax; document.getElementById('firstPaxStat').innerText=currentFlightData.firstPax||'--:--'; document.getElementById('lastPaxStat').innerText=currentFlightData.lastPax||'--:--';
        let regularCount = currentFlightData.passengers.filter(p=>!p.isDelayCharge).length;
        document.getElementById('passengerCount').innerText=regularCount+' PAX';
        document.getElementById('quickShiftText').innerHTML=`${flightNo} | ${shift} <span style="font-size:10px;">(${flightInfo.database})</span>`;
        if(currentFlightData.isClosed){ document.getElementById('flightStatus').innerText='CLOSED'; document.getElementById('flightStatus').className='flight-status status-closed'; document.getElementById('closeFlightBtn').style.display='none'; document.getElementById('reopenFlightBtn').style.display='block'; document.getElementById('printReportBtn').disabled=false; document.getElementById('delayChargeBtn').disabled=true; document.getElementById('stdInput').disabled=true; document.getElementById('lastPaxInput').disabled=true; document.getElementById('flightClosedMessage').style.display='block'; }
        else { document.getElementById('flightStatus').innerText='OPEN'; document.getElementById('flightStatus').className='flight-status status-open'; document.getElementById('closeFlightBtn').style.display='block'; document.getElementById('reopenFlightBtn').style.display='none'; document.getElementById('printReportBtn').disabled=true; document.getElementById('delayChargeBtn').disabled=false; document.getElementById('stdInput').disabled=false; document.getElementById('lastPaxInput').disabled=false; document.getElementById('flightClosedMessage').style.display='none'; validateCloseButton(); }
        displayPassengerTable(currentFlightData.passengers);
        let dupes = detectDuplicates(currentFlightData.passengers); if(dupes.length && !currentFlightData.isClosed) showDuplicateWarning(dupes);
    }
    function detectDuplicates(passengers){ let seen=new Map(), dupes=[]; passengers.forEach((p,idx)=>{ if(p.isDelayCharge) return; let name=(p.pName||'').trim().toLowerCase(); let seat=(p.seatNo||'').trim().toUpperCase(); if(!name||!seat) return; if(p.isGuest) return; let key=`${name}|${seat}`; if(seen.has(key)) dupes.push({originalIndex:seen.get(key), duplicateIndex:idx, passenger:p}); else seen.set(key,idx); }); return dupes; }
    function showDuplicateWarning(dupes){ let warnDiv=document.getElementById('duplicateWarningBanner'); if(!warnDiv){ warnDiv=document.createElement('div'); warnDiv.id='duplicateWarningBanner'; warnDiv.className='duplicate-warning-banner'; document.getElementById('tableContainer').prepend(warnDiv); } warnDiv.innerHTML=`⚠️ ${dupes.length} duplicate regular entries. <button onclick="deleteAllDuplicates()">Delete duplicates</button> <button onclick="dismissDuplicateWarning()">Dismiss</button>`; }
    function dismissDuplicateWarning(){ let el=document.getElementById('duplicateWarningBanner'); if(el) el.remove(); }
    async function deleteAllDuplicates(){ let dupes = detectDuplicates(currentFlightData.passengers); for(let d of dupes){ await currentDatabase.collection('KoveliPass').doc(d.passenger.docId).delete(); } await onFlightSelected(); dismissDuplicateWarning(); }

    function displayPassengerTable(passengers){
        let tbody=document.getElementById('passengerTableBody'); let thead=document.getElementById('tableHeader'); let isFZ = currentFlightData?.flightNo?.toUpperCase().startsWith('FZ'); let isSQ = currentFlightData?.flightNo?.toUpperCase().startsWith('SQ');
        thead.innerHTML = `<tr>${isFZ ? '<th>#</th><th>Name</th><th>PNR</th><th>Seat</th><th>Pax</th><th>FQTV</th><th>Serial</th><th>Time</th><th>Remarks</th><th>Actions</th>' : '<th>#</th><th>${isSQ?'Voucher':'Name'}</th><th>Seat</th><th>Pax</th><th>FQTV</th><th>Serial</th><th>Time</th><th>Remarks</th><th>Actions</th>'}</tr>`;
        let html=''; let regIdx=0;
        passengers.forEach((p,idx)=>{
            if(p.isDelayCharge) regIdx = idx;
            else regIdx = idx;
            let serial = String(regIdx+1).padStart(3,'0');
            let pnr = isFZ ? (p.hiddenCode?.match(/[A-Z0-9]{5,6}/)?.[0] || '-') : '';
            if(editingRowId===p.docId && !currentFlightData?.isClosed){
                html+=`<tr><td>${serial}</td><td><input id="edit-name-${p.docId}" value="${escapeHtml(p.pName)}" class="edit-mode-input"></td>${isFZ?`<td><input value="${pnr}" readonly style="background:#eee;"></td>`:''}<td><input id="edit-seat-${p.docId}" value="${escapeHtml(p.seatNo)}" oninput="updatePaxFromSeat('${p.docId}')"></td><td><input id="edit-pax-${p.docId}" value="${p.pax}" size="3"></td><td><input id="edit-fqtv-${p.docId}" value="${escapeHtml(p.FQTV)}"></td><td><input id="edit-serial-${p.docId}" value="${escapeHtml(p.serialNo)}"></td><td><input type="time" id="edit-time-${p.docId}" value="${p.entryTime||''}"></td><td><input id="edit-remark-${p.docId}" value="${escapeHtml(p.remarks)}"></td><td><button onclick="savePassenger('${p.docId}')">💾</button><button onclick="cancelEdit()">✖</button></td></tr>`;
            } else {
                let badge = (p.isDelayCharge?'<span class="order-badge">⏱️DELAY</span>':'');
                html+=`<tr class="${p.isDelayCharge?'delay-charge-row':''}"><td class="serial-no">${serial}</td><td>${escapeHtml(p.pName)} ${badge}</td>${isFZ?`<td>${pnr}</td>`:''}<td>${escapeHtml(p.seatNo)}</td><td>${p.pax}</td><td>${escapeHtml(p.FQTV)}</td><td>${escapeHtml(p.serialNo)}</td><td>${p.entryTime||'-'}</td><td>${escapeHtml(p.remarks)}</td><td>${!currentFlightData?.isClosed?`<button class="table-action-btn edit-table-btn" onclick="startEdit('${p.docId}')">Edit</button><button class="table-action-btn delete-table-btn" onclick="deletePassenger('${p.docId}')">Del</button>`:'<span>🔒</span>'}</td></tr>`;
            }
        });
        tbody.innerHTML=html;
        document.getElementById('tableContainer').style.display='block';
    }
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function startEdit(id){ editingRowId=id; displayPassengerTable(currentFlightData.passengers); }
    function cancelEdit(){ editingRowId=null; displayPassengerTable(currentFlightData.passengers); }
    async function savePassenger(docId){ if(currentFlightData?.isClosed) return; let pName=document.getElementById(`edit-name-${docId}`).value; let seatNo=document.getElementById(`edit-seat-${docId}`).value; let pax=parseInt(document.getElementById(`edit-pax-${docId}`).value)||1; let FQTV=document.getElementById(`edit-fqtv-${docId}`).value; let serialNo=document.getElementById(`edit-serial-${docId}`).value; let entryTime=document.getElementById(`edit-time-${docId}`).value; let remarks=document.getElementById(`edit-remark-${docId}`).value; await currentDatabase.collection('KoveliPass').doc(docId).update({pName,seatNo,pax,FQTV,serialNo,entryTime,remarks}); await onFlightSelected(); editingRowId=null; }
    async function deletePassenger(docId){ if(confirm('Delete passenger?')){ await currentDatabase.collection('KoveliPass').doc(docId).delete(); await onFlightSelected(); } }
    function validateCloseButton(){ let std=document.getElementById('stdInput').value; let last=document.getElementById('lastPaxInput').value; document.getElementById('closeFlightBtn').disabled = !(std && last); }
    async function updateSTD(){ if(currentFlightData?.isClosed) return; currentFlightData.std=document.getElementById('stdInput').value; await saveFlightData(); validateCloseButton(); }
    async function updateLastPax(){ if(currentFlightData?.isClosed) return; currentFlightData.lastPax=document.getElementById('lastPaxInput').value; document.getElementById('lastPaxStat').innerText=currentFlightData.lastPax; await saveFlightData(); validateCloseButton(); }
    async function saveFlightData(){ if(!currentFlightData) return; let date=document.getElementById('dateDisplay').innerText; let flightNo=document.getElementById('flightNoDisplay').innerText; let formattedDate=date.replace(/\//g,'-'); await currentDatabase.collection('FlightReports').doc(`${flightNo}_${formattedDate}`).set({ flightNo,date:formattedDate,shift:currentFlightData.shift,std:currentFlightData.std||'',lastPax:currentFlightData.lastPax||'',totalPax:currentFlightData.totalPax,isClosed:currentFlightData.isClosed||false },{merge:true}); }
    async function closeFlight(){ if(!currentFlightData) return; currentFlightData.isClosed=true; await saveFlightData(); onFlightSelected(); }
    async function reopenFlight(){ currentFlightData.isClosed=false; await saveFlightData(); onFlightSelected(); }
    function printReport(){ if(!currentFlightData?.isClosed) return; let win=window.open(); let rowsHtml=''; let sorted = [...currentFlightData.passengers].sort((a,b)=> (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0)); sorted.forEach((p,i)=>{ rowsHtml+=`<tr><td>${i+1}</td><td>${escapeHtml(p.pName)}</td><td>${escapeHtml(p.seatNo)}</td><td>${p.pax}</td><td>${p.entryTime||'-'}</td><td>${escapeHtml(p.remarks||'')}</td></tr>`; }); win.document.write(`<html><head><title>Flight Report</title><style>body{font-family:sans-serif; margin:20px;} table{border-collapse:collapse; width:100%} th,td{border:1px solid #ccc; padding:8px;}</style></head><body><h2>${currentFlightData.flightNo} | ${currentFlightData.date}</h2><p>STD: ${currentFlightData.std} | Last Pax: ${currentFlightData.lastPax} | Shift: ${currentFlightData.shift}</p><p>Total Pax: ${currentFlightData.totalPax}</p><table><thead><tr><th>#</th><th>Name</th><th>Seat</th><th>Pax</th><th>Time</th><th>Remarks</th></tr></thead><tbody>${rowsHtml}</tbody></table><p>Generated by: ${getCurrentUser()}</p></body></html>`); win.document.close(); win.print(); }
    // Delay charge modal mockups
    function openDelayChargeModal(){ document.getElementById('delayChargeModal').style.display='flex'; populateDelayFlightSelect(); }
    function closeDelayChargeModal(){ document.getElementById('delayChargeModal').style.display='none'; }
    function populateDelayFlightSelect(){ let date = document.getElementById('dateSelect').value; let sel=document.getElementById('delayFlightSelect'); if(!date||!flightsByDate[date]){sel.innerHTML='<option>No flight</option>'; return;} let opts=''; for(let [k,f] of flightsByDate[date].entries()) opts+=`<option value="${f.flightNo}|${f.shift}">${f.flightNo} (${f.shift})</option>`; sel.innerHTML=opts; }
    async function onDelayFlightSelected(){ let val=document.getElementById('delayFlightSelect').value; if(!val) return; let [fno,shift]=val.split('|'); let date=document.getElementById('dateSelect').value; let db = getFirestoreForFlight(fno); let snap = await db.collection('KoveliPass').where('date','==',date).where('flightNo','==',fno).where('shift','==',shift).get(); let listDiv=document.getElementById('passengerListContainer'); listDiv.style.display='block'; let html=''; snap.forEach(doc=>{ let d=doc.data(); if(!d.delayCharge) html+=`<div class="passenger-item"><input type="checkbox" class="paxSel" data-id="${doc.id}"><span>${d.pName||''}</span><input type="time" class="lastpaxInput" data-id="${doc.id}" placeholder="Last Pax"><span>Pax:${d.pax||1}</span></div>`; }); document.getElementById('passengerList').innerHTML=html; }
    function calculateDelayCharges(){ alert("Delay charge calculation (demo): logic ready"); }
    function submitDelayCharges(){ alert("Demo submit"); closeDelayChargeModal(); }
    function updateAllLastPax(){ }
    window.fetchOpenShift = async function(){ try{ let doc = await passengerDb.collection('shifts').doc('currentshift').get(); if(doc.exists){ let d=doc.data(); document.getElementById('shiftBadge').innerText = d.morning==='open'?'MORNING':'EVENING'; document.getElementById('ribbonDate').innerText=d.date||''; } }catch(e){} };
    window.updatePaxFromSeat = function(docId){ let seat = document.getElementById(`edit-seat-${docId}`).value; let letters = (seat.match(/[A-Za-z]/g)||[]).length; document.getElementById(`edit-pax-${docId}`).value = letters||1; };
    setInterval(()=>fetchOpenShift(), 30000);
    document.addEventListener('DOMContentLoaded',()=>{ fetchOpenShift(); scanDatesAndFlights(); });
    window.scanDatesAndFlights=scanDatesAndFlights; window.onDateSelected=onDateSelected; window.onFlightSelected=onFlightSelected; window.updateSTD=updateSTD; window.updateLastPax=updateLastPax; window.closeFlight=closeFlight; window.reopenFlight=reopenFlight; window.printReport=printReport; window.startEdit=startEdit; window.cancelEdit=cancelEdit; window.savePassenger=savePassenger; window.deletePassenger=deletePassenger; window.openDelayChargeModal=openDelayChargeModal; window.closeDelayChargeModal=closeDelayChargeModal; window.onDelayFlightSelected=onDelayFlightSelected; window.calculateDelayCharges=calculateDelayCharges; window.submitDelayCharges=submitDelayCharges; window.updateAllLastPax=updateAllLastPax; window.clearDateCache=clearDateCache; window.deleteAllDuplicates=deleteAllDuplicates; window.dismissDuplicateWarning=dismissDuplicateWarning;
</script>
