<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PDF Editor & Signer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #e5e7eb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #0f3b2c;
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 1.2rem;
            flex: 1;
        }

        button {
            background: #2d5a4a;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #d97706;
        }

        .toolbar {
            background: white;
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 1px solid #d1d5db;
        }

        .tool-btn {
            background: #f3f4f6;
            color: #1f2937;
            border: 1px solid #d1d5db;
            padding: 8px 16px;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            border-radius: 8px;
        }

        .tool-btn.active {
            background: #0f3b2c;
            color: white;
            border-color: #0f3b2c;
        }

        .pdf-viewer {
            flex: 1;
            overflow: auto;
            background: #374151;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        #pdfCanvas {
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border-radius: 4px;
            background: white;
            display: block;
            max-width: 100%;
            height: auto;
        }

        .no-pdf {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
            background: white;
            border-radius: 12px;
            margin: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 450px;
            padding: 24px;
            text-align: center;
        }

        .modal-card h3 {
            margin-bottom: 16px;
            color: #0f3b2c;
        }

        #sigCanvas {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            width: 100%;
            height: auto;
            touch-action: none;
            cursor: crosshair;
        }

        .sig-buttons {
            display: flex;
            gap: 10px;
            margin: 16px 0;
            justify-content: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            margin: 8px 0;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📄 PDF Sign & Edit</h1>
    <button id="uploadBtn">📂 Upload PDF</button>
    <button id="saveBtn" class="btn-primary">💾 Save PDF</button>
</div>

<div class="toolbar">
    <button class="tool-btn" data-mode="text">✏️ Add Text</button>
    <button class="tool-btn" data-mode="draw">🖌️ Draw</button>
    <button class="tool-btn" data-mode="sign">🖊️ Add Signature</button>
    <button class="tool-btn" id="clearDraw">🗑️ Clear Drawings</button>
</div>

<div class="pdf-viewer" id="pdfViewer">
    <div class="no-pdf" id="noPdfMsg">
        📁 Click "Upload PDF" to start<br><br>
        ✏️ Double-click to add text<br>
        🖌️ Select Draw to freehand draw<br>
        🖊️ Select Signature to sign
    </div>
    <canvas id="pdfCanvas" style="display: none;"></canvas>
</div>

<!-- Signature Modal -->
<div id="sigModal" class="modal">
    <div class="modal-card">
        <h3>✍️ Draw Your Signature</h3>
        <canvas id="sigCanvas" width="400" height="200"></canvas>
        <div class="sig-buttons">
            <button id="clearSigBtn">Clear</button>
            <button id="saveSigBtn" class="btn-primary">Use Signature</button>
            <button id="cancelSigBtn">Cancel</button>
        </div>
        <p style="margin: 12px 0 4px;">— or type signature —</p>
        <input type="text" id="typedSignature" placeholder="Type your name">
        <button id="useTypedBtn" style="margin-top: 8px; width: 100%;">Use Typed Name</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDoc = null;
    let currentPage = 1;
    let pdfScale = 1.5;
    let canvas = document.getElementById('pdfCanvas');
    let ctx = canvas.getContext('2d', { willReadFrequently: true });
    let currentMode = 'text';
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let drawings = []; // Store drawings as objects
    let texts = []; // Store text annotations
    let signatures = []; // Store signature images
    let currentPdfBytes = null;
    let currentPageWidth = 0;
    let currentPageHeight = 0;

    const uploadBtn = document.getElementById('uploadBtn');
    const saveBtn = document.getElementById('saveBtn');
    const clearDrawBtn = document.getElementById('clearDraw');
    const pdfViewer = document.getElementById('pdfViewer');
    const noPdfMsg = document.getElementById('noPdfMsg');
    const sigModal = document.getElementById('sigModal');
    const sigCanvas = document.getElementById('sigCanvas');
    let sigCtx = sigCanvas.getContext('2d');
    let signing = false;
    let lastSigX, lastSigY;

    uploadBtn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/pdf';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    currentPdfBytes = ev.target.result;
                    await loadPDF(currentPdfBytes);
                };
                reader.readAsArrayBuffer(file);
            }
        };
        input.click();
    });

    async function loadPDF(arrayBuffer) {
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        currentPage = 1;
        await renderPage(currentPage);
        noPdfMsg.style.display = 'none';
        canvas.style.display = 'block';
        
        // Clear previous annotations
        drawings = [];
        texts = [];
        signatures = [];
        redrawCanvas();
    }

    async function renderPage(pageNum) {
        if (!pdfDoc) return;
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: pdfScale });
        
        currentPageWidth = viewport.width;
        currentPageHeight = viewport.height;
        
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        
        await page.render({ canvasContext: ctx, viewport }).promise;
        
        // Redraw annotations on top
        redrawCanvas();
    }

    function redrawCanvas() {
        if (!pdfDoc) return;
        
        // Redraw PDF (preserve original)
        renderPage(currentPage);
        
        // Wait a bit for PDF to render, then draw annotations
        setTimeout(() => {
            // Draw drawings
            drawings.forEach(drawing => {
                ctx.save();
                ctx.beginPath();
                ctx.strokeStyle = drawing.color;
                ctx.lineWidth = drawing.width;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                if (drawing.points.length > 0) {
                    ctx.moveTo(drawing.points[0].x, drawing.points[0].y);
                    for (let i = 1; i < drawing.points.length; i++) {
                        ctx.lineTo(drawing.points[i].x, drawing.points[i].y);
                    }
                    ctx.stroke();
                }
                ctx.restore();
            });
            
            // Draw text annotations
            texts.forEach(text => {
                ctx.save();
                ctx.font = `${text.fontSize}px ${text.fontFamily}`;
                ctx.fillStyle = text.color;
                ctx.textBaseline = 'top';
                ctx.fillText(text.content, text.x, text.y);
                ctx.restore();
            });
            
            // Draw signatures
            signatures.forEach(sig => {
                if (sig.img) {
                    ctx.drawImage(sig.img, sig.x, sig.y, sig.width, sig.height);
                }
            });
        }, 100);
    }

    // Drawing on canvas
    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        
        let x = (clientX - rect.left) * scaleX;
        let y = (clientY - rect.top) * scaleY;
        
        x = Math.max(0, Math.min(canvas.width, x));
        y = Math.max(0, Math.min(canvas.height, y));
        
        return { x, y };
    }

    function startDrawing(e) {
        if (currentMode !== 'draw') return;
        e.preventDefault();
        isDrawing = true;
        const pos = getMousePos(e);
        lastX = pos.x;
        lastY = pos.y;
        
        // Start new drawing path
        drawings.push({
            points: [{ x: lastX, y: lastY }],
            color: '#dc2626',
            width: 3
        });
    }

    function draw(e) {
        if (!isDrawing || currentMode !== 'draw') return;
        e.preventDefault();
        const pos = getMousePos(e);
        
        if (drawings.length > 0) {
            drawings[drawings.length - 1].points.push({ x: pos.x, y: pos.y });
            redrawCanvas();
        }
        
        lastX = pos.x;
        lastY = pos.y;
    }

    function stopDrawing() {
        isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    // Add text on double-click
    canvas.addEventListener('dblclick', (e) => {
        if (currentMode === 'text') {
            const pos = getMousePos(e);
            const newText = prompt('Enter your text:', 'Edit this text');
            if (newText && newText.trim()) {
                texts.push({
                    content: newText,
                    x: pos.x,
                    y: pos.y,
                    fontSize: 20,
                    fontFamily: 'Arial',
                    color: '#000000'
                });
                redrawCanvas();
            }
        }
    });

    // Mode switching
    document.querySelectorAll('.tool-btn[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
            currentMode = btn.dataset.mode;
            document.querySelectorAll('.tool-btn[data-mode]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (currentMode === 'sign') {
                openSignatureModal();
            }
        });
    });

    // Signature functions
    function openSignatureModal() {
        sigModal.style.display = 'flex';
        sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
        sigCtx.fillStyle = 'white';
        sigCtx.fillRect(0, 0, sigCanvas.width, sigCanvas.height);
        sigCtx.strokeStyle = '#000';
        sigCtx.lineWidth = 2;
        sigCtx.lineCap = 'round';
        sigCtx.lineJoin = 'round';
    }

    function getSigCoords(e, canvasEl) {
        const rect = canvasEl.getBoundingClientRect();
        const scaleX = canvasEl.width / rect.width;
        const scaleY = canvasEl.height / rect.height;
        let clientX, clientY;
        
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        
        const x = (clientX - rect.left) * scaleX;
        const y = (clientY - rect.top) * scaleY;
        return { x, y };
    }

    function startSign(e) {
        e.preventDefault();
        signing = true;
        const coords = getSigCoords(e, sigCanvas);
        lastSigX = coords.x;
        lastSigY = coords.y;
        sigCtx.beginPath();
        sigCtx.moveTo(lastSigX, lastSigY);
    }

    function drawSign(e) {
        e.preventDefault();
        if (!signing) return;
        const coords = getSigCoords(e, sigCanvas);
        sigCtx.lineTo(coords.x, coords.y);
        sigCtx.stroke();
        sigCtx.beginPath();
        sigCtx.moveTo(coords.x, coords.y);
        lastSigX = coords.x;
        lastSigY = coords.y;
    }

    function endSign() {
        signing = false;
        sigCtx.beginPath();
    }

    sigCanvas.addEventListener('mousedown', startSign);
    sigCanvas.addEventListener('mousemove', drawSign);
    sigCanvas.addEventListener('mouseup', endSign);
    sigCanvas.addEventListener('touchstart', startSign);
    sigCanvas.addEventListener('touchmove', drawSign);
    sigCanvas.addEventListener('touchend', endSign);

    document.getElementById('clearSigBtn').onclick = () => {
        sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
        sigCtx.fillStyle = 'white';
        sigCtx.fillRect(0, 0, sigCanvas.width, sigCanvas.height);
    };

    document.getElementById('saveSigBtn').onclick = () => {
        const dataURL = sigCanvas.toDataURL();
        const img = new Image();
        img.onload = () => {
            // Ask user where to place signature
            alert('Click on the PDF to place your signature');
            sigModal.style.display = 'none';
            
            const placeSignature = (e) => {
                const pos = getMousePos(e);
                signatures.push({
                    img: img,
                    x: pos.x,
                    y: pos.y,
                    width: 150,
                    height: 75
                });
                redrawCanvas();
                canvas.removeEventListener('click', placeSignature);
                currentMode = 'text';
                document.querySelector('.tool-btn[data-mode="text"]').classList.add('active');
                document.querySelector('.tool-btn[data-mode="sign"]').classList.remove('active');
            };
            
            canvas.addEventListener('click', placeSignature);
        };
        img.src = dataURL;
        document.getElementById('typedSignature').value = '';
    };

    document.getElementById('useTypedBtn').onclick = () => {
        const typedName = document.getElementById('typedSignature').value;
        if (typedName.trim()) {
            alert('Click on the PDF to place your signature');
            sigModal.style.display = 'none';
            
            const placeTyped = (e) => {
                const pos = getMousePos(e);
                texts.push({
                    content: typedName,
                    x: pos.x,
                    y: pos.y,
                    fontSize: 28,
                    fontFamily: 'cursive',
                    color: '#000000'
                });
                redrawCanvas();
                canvas.removeEventListener('click', placeTyped);
                currentMode = 'text';
                document.querySelector('.tool-btn[data-mode="text"]').classList.add('active');
                document.querySelector('.tool-btn[data-mode="sign"]').classList.remove('active');
            };
            
            canvas.addEventListener('click', placeTyped);
            document.getElementById('typedSignature').value = '';
        } else {
            alert('Please type a name or draw a signature');
        }
    };

    document.getElementById('cancelSigBtn').onclick = () => {
        sigModal.style.display = 'none';
        currentMode = 'text';
        document.querySelector('.tool-btn[data-mode="text"]').classList.add('active');
        document.querySelector('.tool-btn[data-mode="sign"]').classList.remove('active');
        document.getElementById('typedSignature').value = '';
    };

    // Clear all drawings
    clearDrawBtn.onclick = () => {
        drawings = [];
        texts = [];
        signatures = [];
        redrawCanvas();
    };

    // Save PDF
    saveBtn.onclick = async () => {
        if (!pdfDoc) {
            alert('Please upload a PDF first');
            return;
        }
        
        alert('Generating PDF with annotations...');
        
        try {
            const pdfDocLib = await PDFLib.PDFDocument.load(currentPdfBytes);
            const pages = pdfDocLib.getPages();
            const firstPage = pages[0];
            
            // Create overlay canvas with all annotations
            const overlayCanvas = document.createElement('canvas');
            overlayCanvas.width = canvas.width;
            overlayCanvas.height = canvas.height;
            const overlayCtx = overlayCanvas.getContext('2d');
            
            // Draw PDF content
            overlayCtx.drawImage(canvas, 0, 0);
            
            // Draw all drawings
            drawings.forEach(drawing => {
                overlayCtx.beginPath();
                overlayCtx.strokeStyle = drawing.color;
                overlayCtx.lineWidth = drawing.width;
                overlayCtx.lineCap = 'round';
                overlayCtx.lineJoin = 'round';
                
                if (drawing.points.length > 0) {
                    overlayCtx.moveTo(drawing.points[0].x, drawing.points[0].y);
                    for (let i = 1; i < drawing.points.length; i++) {
                        overlayCtx.lineTo(drawing.points[i].x, drawing.points[i].y);
                    }
                    overlayCtx.stroke();
                }
            });
            
            // Draw texts
            texts.forEach(text => {
                overlayCtx.font = `${text.fontSize}px ${text.fontFamily}`;
                overlayCtx.fillStyle = text.color;
                overlayCtx.textBaseline = 'top';
                overlayCtx.fillText(text.content, text.x, text.y);
            });
            
            // Draw signatures
            signatures.forEach(sig => {
                overlayCtx.drawImage(sig.img, sig.x, sig.y, sig.width, sig.height);
            });
            
            const overlayImage = await pdfDocLib.embedPng(overlayCanvas.toDataURL());
            const pageWidth = firstPage.getWidth();
            const pageHeight = firstPage.getHeight();
            
            firstPage.drawImage(overlayImage, {
                x: 0,
                y: 0,
                width: pageWidth,
                height: pageHeight
            });
            
            const modifiedPdfBytes = await pdfDocLib.save();
            const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = 'signed_document.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            alert('✅ PDF saved successfully!');
        } catch (error) {
            console.error('Save error:', error);
            alert('Error saving PDF: ' + error.message);
        }
    };
</script>
</body>
</html>
