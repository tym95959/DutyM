<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PDF Editor & Signer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #e5e7eb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: #0f3b2c;
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 1.2rem;
            flex: 1;
        }

        button {
            background: #2d5a4a;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }

        button:active {
            transform: scale(0.96);
            background: #1e3d31;
        }

        .btn-primary {
            background: #d97706;
        }

        .btn-primary:active {
            background: #b45309;
        }

        /* Toolbar */
        .toolbar {
            background: white;
            padding: 10px 12px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 1px solid #d1d5db;
            position: sticky;
            top: 0;
        }

        .tool-btn {
            background: #f3f4f6;
            color: #1f2937;
            border: 1px solid #d1d5db;
            padding: 8px 16px;
            font-size: 14px;
            white-space: nowrap;
        }

        .tool-btn.active {
            background: #0f3b2c;
            color: white;
            border-color: #0f3b2c;
        }

        /* PDF Viewer */
        .pdf-viewer {
            flex: 1;
            overflow: auto;
            background: #374151;
            padding: 20px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            background: white;
            border-radius: 4px;
            width: 100%;
            height: auto;
        }

        /* Signature Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            border-radius: 24px;
            width: 90%;
            max-width: 450px;
            padding: 24px;
            text-align: center;
        }

        .modal-card h3 {
            margin-bottom: 16px;
            color: #0f3b2c;
        }

        #sigCanvas {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            width: 100%;
            height: auto;
            touch-action: none;
            cursor: crosshair;
        }

        .sig-buttons {
            display: flex;
            gap: 10px;
            margin: 16px 0;
            justify-content: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            margin: 8px 0;
        }

        .no-pdf {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📄 PDF Sign & Edit</h1>
    <button id="uploadBtn">📂 Upload PDF</button>
    <button id="saveBtn" class="btn-primary">💾 Save PDF</button>
</div>

<div class="toolbar">
    <button class="tool-btn" data-mode="text">✏️ Add Text</button>
    <button class="tool-btn" data-mode="draw">🖌️ Draw</button>
    <button class="tool-btn" data-mode="sign">🖊️ Add Signature</button>
    <button class="tool-btn" id="clearDraw">🗑️ Clear Drawings</button>
</div>

<div class="pdf-viewer" id="pdfViewer">
    <div class="no-pdf">
        📁 Click "Upload PDF" to start<br>
        Add text, draw, or sign your document
    </div>
    <canvas id="pdfCanvas" style="display: none;"></canvas>
</div>

<!-- Signature Modal -->
<div id="sigModal" class="modal">
    <div class="modal-card">
        <h3>✍️ Draw Your Signature</h3>
        <canvas id="sigCanvas" width="400" height="200"></canvas>
        <div class="sig-buttons">
            <button id="clearSigBtn">Clear</button>
            <button id="saveSigBtn" class="btn-primary">Use Signature</button>
            <button id="cancelSigBtn">Cancel</button>
        </div>
        <p style="margin: 12px 0 4px;">— or type signature —</p>
        <input type="text" id="typedSignature" placeholder="Type your name">
        <button id="useTypedBtn" style="margin-top: 8px; width: 100%;">Use Typed Name</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDoc = null;
    let currentPage = 1;
    let pdfScale = 1.3;
    let canvas = document.getElementById('pdfCanvas');
    let ctx = canvas.getContext('2d');
    let fabricCanvas = null;
    let currentMode = 'text';
    let isDrawing = false;

    // DOM elements
    const uploadBtn = document.getElementById('uploadBtn');
    const saveBtn = document.getElementById('saveBtn');
    const clearDrawBtn = document.getElementById('clearDraw');
    const pdfViewer = document.getElementById('pdfViewer');
    const sigModal = document.getElementById('sigModal');
    const sigCanvas = document.getElementById('sigCanvas');
    let sigCtx = sigCanvas.getContext('2d');
    let signing = false;
    let lastX, lastY;

    // Upload PDF
    uploadBtn.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/pdf';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    await loadPDF(ev.target.result);
                };
                reader.readAsArrayBuffer(file);
            }
        };
        input.click();
    });

    async function loadPDF(arrayBuffer) {
        pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        currentPage = 1;
        await renderPage(currentPage);
        document.querySelector('.no-pdf')?.remove();
        canvas.style.display = 'block';
    }

    async function renderPage(pageNum) {
        if (!pdfDoc) return;
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: pdfScale });
        
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        
        await page.render({ canvasContext: ctx, viewport }).promise;
        
        // Initialize fabric overlay
        if (fabricCanvas) fabricCanvas.dispose();
        fabricCanvas = new fabric.Canvas(canvas, {
            selection: true,
            allowTouchScrolling: true,
            width: viewport.width,
            height: viewport.height
        });
        
        // Drawing mode
        fabricCanvas.on('mouse:down', (opt) => {
            if (currentMode === 'draw' && opt.e) {
                isDrawing = true;
                const pointer = fabricCanvas.getPointer(opt.e);
                const path = new fabric.Path(`M ${pointer.x} ${pointer.y}`, {
                    stroke: '#dc2626',
                    strokeWidth: 3,
                    fill: '',
                    selectable: false
                });
                fabricCanvas.add(path);
                fabricCanvas.currentPath = path;
            }
        });
        
        fabricCanvas.on('mouse:move', (opt) => {
            if (currentMode === 'draw' && isDrawing && fabricCanvas.currentPath) {
                const pointer = fabricCanvas.getPointer(opt.e);
                const newPath = fabricCanvas.currentPath.path.concat([['L', pointer.x, pointer.y]]);
                fabricCanvas.currentPath.set({ path: newPath });
                fabricCanvas.renderAll();
            }
        });
        
        fabricCanvas.on('mouse:up', () => {
            if (fabricCanvas.currentPath) {
                fabricCanvas.currentPath.set({ selectable: true, evented: true });
                fabricCanvas.currentPath = null;
            }
            isDrawing = false;
        });
        
        // Double click to add text
        fabricCanvas.on('mouse:dblclick', (e) => {
            if (currentMode === 'text') {
                const pointer = fabricCanvas.getPointer(e.e);
                const textbox = new fabric.Textbox('Edit text', {
                    left: pointer.x,
                    top: pointer.y,
                    width: 150,
                    fontSize: 18,
                    fill: '#000000',
                    backgroundColor: 'rgba(255,255,0,0.3)',
                    editable: true
                });
                fabricCanvas.add(textbox);
                fabricCanvas.setActiveObject(textbox);
                fabricCanvas.renderAll();
            }
        });
    }

    // Mode switching
    document.querySelectorAll('.tool-btn[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
            currentMode = btn.dataset.mode;
            document.querySelectorAll('.tool-btn[data-mode]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (currentMode === 'sign') {
                openSignatureModal();
            }
        });
    });

    // Signature modal functions
    function openSignatureModal() {
        sigModal.style.display = 'flex';
        sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
        sigCtx.fillStyle = 'white';
        sigCtx.fillRect(0, 0, sigCanvas.width, sigCanvas.height);
        sigCtx.strokeStyle = '#000';
        sigCtx.lineWidth = 2;
        sigCtx.lineCap = 'round';
        sigCtx.lineJoin = 'round';
    }

    // Touch drawing on signature canvas
    function getCanvasCoords(e, canvasEl) {
        const rect = canvasEl.getBoundingClientRect();
        const scaleX = canvasEl.width / rect.width;
        const scaleY = canvasEl.height / rect.height;
        let clientX, clientY;
        
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        
        const x = (clientX - rect.left) * scaleX;
        const y = (clientY - rect.top) * scaleY;
        return { x, y };
    }

    function startSign(e) {
        e.preventDefault();
        signing = true;
        const coords = getCanvasCoords(e, sigCanvas);
        lastX = coords.x;
        lastY = coords.y;
        sigCtx.beginPath();
        sigCtx.moveTo(lastX, lastY);
    }

    function drawSign(e) {
        e.preventDefault();
        if (!signing) return;
        const coords = getCanvasCoords(e, sigCanvas);
        sigCtx.lineTo(coords.x, coords.y);
        sigCtx.stroke();
        sigCtx.beginPath();
        sigCtx.moveTo(coords.x, coords.y);
        lastX = coords.x;
        lastY = coords.y;
    }

    function endSign() {
        signing = false;
        sigCtx.beginPath();
    }

    sigCanvas.addEventListener('mousedown', startSign);
    sigCanvas.addEventListener('mousemove', drawSign);
    sigCanvas.addEventListener('mouseup', endSign);
    sigCanvas.addEventListener('touchstart', startSign);
    sigCanvas.addEventListener('touchmove', drawSign);
    sigCanvas.addEventListener('touchend', endSign);

    document.getElementById('clearSigBtn').onclick = () => {
        sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
        sigCtx.fillStyle = 'white';
        sigCtx.fillRect(0, 0, sigCanvas.width, sigCanvas.height);
    };

    document.getElementById('saveSigBtn').onclick = () => {
        const dataURL = sigCanvas.toDataURL();
        fabric.Image.fromURL(dataURL, (img) => {
            img.scaleToWidth(150);
            fabricCanvas.add(img);
            fabricCanvas.renderAll();
        });
        sigModal.style.display = 'none';
        currentMode = 'text';
        document.querySelector('.tool-btn[data-mode="text"]').classList.add('active');
        document.querySelector('.tool-btn[data-mode="sign"]').classList.remove('active');
    };

    document.getElementById('useTypedBtn').onclick = () => {
        const typedName = document.getElementById('typedSignature').value;
        if (typedName.trim()) {
            const text = new fabric.Text(typedName, {
                fontSize: 28,
                fontFamily: 'cursive',
                fill: '#000',
                fontStyle: 'italic'
            });
            fabricCanvas.add(text);
            fabricCanvas.renderAll();
            sigModal.style.display = 'none';
            currentMode = 'text';
            document.querySelector('.tool-btn[data-mode="text"]').classList.add('active');
            document.querySelector('.tool-btn[data-mode="sign"]').classList.remove('active');
        } else {
            alert('Please type a name');
        }
    };

    document.getElementById('cancelSigBtn').onclick = () => {
        sigModal.style.display = 'none';
        currentMode = 'text';
        document.querySelector('.tool-btn[data-mode="text"]').classList.add('active');
        document.querySelector('.tool-btn[data-mode="sign"]').classList.remove('active');
    };

    // Clear drawings
    clearDrawBtn.onclick = () => {
        if (fabricCanvas) {
            const objects = fabricCanvas.getObjects();
            objects.forEach(obj => {
                if (obj.type === 'path' || obj.type === 'textbox') {
                    fabricCanvas.remove(obj);
                }
            });
            fabricCanvas.renderAll();
        }
    };

    // Save PDF with edits
    saveBtn.onclick = async () => {
        if (!pdfDoc) {
            alert('Please upload a PDF first');
            return;
        }
        
        alert('Saving PDF...');
        
        try {
            const pdfBytes = await pdfDoc.getData();
            const pdfDocLib = await PDFLib.PDFDocument.load(pdfBytes);
            const pages = pdfDocLib.getPages();
            const firstPage = pages[0];
            
            // Create overlay canvas with all edits
            const overlayCanvas = document.createElement('canvas');
            overlayCanvas.width = canvas.width;
            overlayCanvas.height = canvas.height;
            const overlayCtx = overlayCanvas.getContext('2d');
            
            // Draw original PDF page
            overlayCtx.drawImage(canvas, 0, 0);
            
            // Draw fabric objects
            fabricCanvas.getObjects().forEach(obj => {
                if (obj.type === 'textbox') {
                    overlayCtx.font = `${obj.fontSize}px ${obj.fontFamily || 'Arial'}`;
                    overlayCtx.fillStyle = obj.fill;
                    overlayCtx.fillText(obj.text, obj.left, obj.top + obj.fontSize);
                } else if (obj.type === 'image') {
                    const img = new Image();
                    img.src = obj.toDataURL();
                    overlayCtx.drawImage(img, obj.left, obj.top, obj.width * obj.scaleX, obj.height * obj.scaleY);
                } else if (obj.type === 'path') {
                    overlayCtx.beginPath();
                    const path = obj.path;
                    let first = true;
                    path.forEach(cmd => {
                        if (cmd[0] === 'M') {
                            if (!first) overlayCtx.stroke();
                            overlayCtx.beginPath();
                            overlayCtx.moveTo(cmd[1], cmd[2]);
                            first = false;
                        } else if (cmd[0] === 'L') {
                            overlayCtx.lineTo(cmd[1], cmd[2]);
                        }
                    });
                    overlayCtx.strokeStyle = obj.stroke;
                    overlayCtx.lineWidth = obj.strokeWidth;
                    overlayCtx.stroke();
                }
            });
            
            const overlayImage = await pdfDocLib.embedPng(overlayCanvas.toDataURL());
            const pageWidth = firstPage.getWidth();
            const pageHeight = firstPage.getHeight();
            
            firstPage.drawImage(overlayImage, {
                x: 0,
                y: 0,
                width: pageWidth,
                height: pageHeight
            });
            
            const modifiedPdfBytes = await pdfDocLib.save();
            const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = 'signed_document.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            alert('✅ PDF saved successfully!');
        } catch (error) {
            console.error('Save error:', error);
            alert('Error saving PDF. Check console for details.');
        }
    };
</script>
</body>
</html>
