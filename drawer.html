<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EPSON TM-T88VII · Single Line Print</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .print-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            max-width: 520px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.5);
            backdrop-filter: blur(2px);
        }

        .printer-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1.8rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .printer-icon {
            font-size: 3rem;
            background: #2d3748;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .printer-info h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1a202c;
        }

        .printer-info p {
            color: #4a5568;
            font-size: 0.8rem;
            font-family: monospace;
            margin-top: 4px;
        }

        .badge {
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }

        .input-section {
            margin: 1.8rem 0;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4a5568;
            margin-bottom: 0.6rem;
        }

        .line-input {
            width: 100%;
            padding: 1rem 1.2rem;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-family: 'Courier New', monospace;
            transition: all 0.2s;
            background: #fefefe;
        }

        .line-input:focus {
            outline: none;
            border-color: #38a169;
            box-shadow: 0 0 0 3px rgba(56,161,105,0.2);
        }

        .preview-area {
            background: #f7fafc;
            border-radius: 16px;
            padding: 1rem;
            margin: 1rem 0;
            border: 1px solid #e2e8f0;
        }

        .preview-label {
            font-size: 0.7rem;
            color: #718096;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-line {
            font-family: 'Courier New', 'Fira Code', monospace;
            font-size: 1rem;
            background: white;
            padding: 12px;
            border-radius: 12px;
            border-left: 4px solid #38a169;
            white-space: pre-wrap;
            word-break: break-all;
        }

        button {
            background: linear-gradient(95deg, #2d3748, #1a202c);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 1rem 0;
        }

        button:hover {
            background: linear-gradient(95deg, #38a169, #2f855a);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .print-status {
            background: #edf2f7;
            border-radius: 16px;
            padding: 0.8rem 1rem;
            margin-top: 1rem;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #2d3748;
        }

        .print-status.success {
            background: #c6f6d5;
            color: #22543d;
        }

        .print-status.error {
            background: #fed7d7;
            color: #742a2a;
        }

        .print-status.info {
            background: #bee3f8;
            color: #2c5282;
        }

        .footer-note {
            font-size: 0.7rem;
            text-align: center;
            color: #718096;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #e2e8f0;
        }

        .sample-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 0.5rem;
        }

        .sample-btn {
            background: #e2e8f0;
            color: #2d3748;
            padding: 0.4rem 1rem;
            font-size: 0.7rem;
            font-weight: 500;
            width: auto;
            margin: 0;
            display: inline-flex;
        }

        .sample-btn:hover {
            background: #cbd5e0;
            transform: none;
            box-shadow: none;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .printing {
            animation: pulse 0.8s ease-in-out infinite;
        }
    </style>
</head>
<body>
<div class="print-card">
    <div class="printer-header">
        <div class="printer-icon">
            🧾
        </div>
        <div class="printer-info">
            <h2>EPSON TM-T88VII</h2>
            <p>Model M371A · Thermal Receipt Printer</p>
            <span class="badge">✓ ESC/POS Ready</span>
        </div>
    </div>

    <div class="input-section">
        <label>📝 LINE TO PRINT</label>
        <input type="text" id="printLine" class="line-input" placeholder="Enter the text you want to print..." value="Welcome to Koveli Lounge" autocomplete="off">
        
        <div class="sample-buttons">
            <button type="button" class="sample-btn" data-sample="Koveli Lounge - Authorized Access">🏷️ Sample</button>
            <button type="button" class="sample-btn" data-sample="Thank you for your visit!">✨ Thank You</button>
            <button type="button" class="sample-btn" data-sample="Device Authorized • EPSON Ready">🖨️ Test Line</button>
        </div>
    </div>

    <div class="preview-area">
        <div class="preview-label">
            <span>👁️ Preview</span>
            <span style="font-size:0.65rem;">(how it will look on paper)</span>
        </div>
        <div class="preview-line" id="previewLine">
            Welcome to Koveli Lounge
        </div>
    </div>

    <button id="printBtn">
        <span>🖨️</span> PRINT SINGLE LINE
    </button>

    <div id="statusMessage" class="print-status info">
        <span>⏳</span> <span>Ready — Enter text and click print.</span>
    </div>

    <div class="footer-note">
        <span>⚡ EPSON TM-T88VII (M371A) · ESC/POS compatible</span><br>
        <span style="font-size:0.65rem;">Printer must be connected via USB, Ethernet, or Windows driver</span>
    </div>
</div>

<script>
    // ==================================================================
    // EPSON TM-T88VII Model M371A - Single Line Print
    // Supports: WebUSB (direct), Browser Print (via window.print),
    //           and ESC/POS raw commands for thermal receipt printers
    // ==================================================================
    
    const printLineInput = document.getElementById('printLine');
    const previewDiv = document.getElementById('previewLine');
    const printBtn = document.getElementById('printBtn');
    const statusDiv = document.getElementById('statusMessage');
    
    let isPrinting = false;
    
    // Update preview as user types
    function updatePreview() {
        let text = printLineInput.value;
        if (text === "") text = "␣ (empty line)";
        previewDiv.textContent = text;
    }
    
    printLineInput.addEventListener('input', updatePreview);
    updatePreview();
    
    // Sample buttons
    document.querySelectorAll('.sample-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const sampleText = btn.getAttribute('data-sample');
            if (sampleText) {
                printLineInput.value = sampleText;
                updatePreview();
                printLineInput.focus();
                setStatus(`Sample loaded: "${sampleText.substring(0, 40)}${sampleText.length > 40 ? '...' : ''}"`, 'info');
            }
        });
    });
    
    function setStatus(message, type = 'info') {
        const statusSpan = statusDiv.querySelector('span:last-child');
        if (statusSpan) {
            statusSpan.textContent = message;
        } else {
            statusDiv.innerHTML = `<span>${type === 'success' ? '✅' : (type === 'error' ? '❌' : 'ℹ️')}</span><span>${message}</span>`;
        }
        statusDiv.className = 'print-status';
        if (type === 'success') statusDiv.classList.add('success');
        else if (type === 'error') statusDiv.classList.add('error');
        else if (type === 'info') statusDiv.classList.add('info');
    }
    
    // ==============================================================
    // METHOD 1: WebUSB for direct ESC/POS printing (EPSON TM series)
    // This sends raw ESC/POS commands to the printer via USB
    // ==============================================================
    async function printViaWebUSB(lineText) {
        if (!lineText.trim()) {
            setStatus('⚠️ Cannot print empty line. Enter some text.', 'error');
            return false;
        }
        
        // Request USB device (EPSON vendor ID: 0x04B8)
        try {
            const device = await navigator.usb.requestDevice({
                filters: [
                    { vendorId: 0x04B8 }, // EPSON vendor ID
                    // Optional: productId for TM-T88VII (common IDs: 0x0202, 0x0e15, etc.)
                ]
            });
            
            await device.open();
            
            // Select configuration and claim interface
            if (device.configuration === null) {
                await device.selectConfiguration(1);
            }
            await device.claimInterface(0);
            
            // ========== ESC/POS Commands ==========
            // ESC/POS initialization
            const initCommand = new Uint8Array([0x1B, 0x40]);
            
            // Select character font (Font A)
            const selectFont = new Uint8Array([0x1B, 0x4D, 0x00]);
            
            // Set alignment: center (0x31 = center, 0x30 = left, 0x32 = right)
            const alignCenter = new Uint8Array([0x1B, 0x61, 0x31]);
            const alignLeft = new Uint8Array([0x1B, 0x61, 0x30]);
            
            // Enable bold
            const boldOn = new Uint8Array([0x1B, 0x45, 0x01]);
            const boldOff = new Uint8Array([0x1B, 0x45, 0x00]);
            
            // Text to print with encoding (windows-1252 / CP437 for receipts)
            const encoder = new TextEncoder();
            const textData = encoder.encode(lineText + "\n");
            
            // Feed line and cut (GS V 0x41 full cut, or feed 3 lines)
            const feedAndCut = new Uint8Array([0x1D, 0x56, 0x41, 0x00]); // Full cut
            const feedPaper = new Uint8Array([0x1B, 0x64, 0x03]); // Feed 3 lines
            
            // Build complete print job
            const chunks = [
                initCommand,
                alignCenter,
                boldOn,
                textData,
                boldOff,
                feedPaper,
                feedAndCut
            ];
            
            // Calculate total length
            let totalLength = 0;
            chunks.forEach(chunk => { totalLength += chunk.length; });
            
            const fullData = new Uint8Array(totalLength);
            let offset = 0;
            chunks.forEach(chunk => {
                fullData.set(chunk, offset);
                offset += chunk.length;
            });
            
            // Send data to printer
            await device.transferOut(1, fullData);
            
            await device.close();
            return true;
            
        } catch (usbError) {
            console.warn('WebUSB error:', usbError);
            return false;
        }
    }
    
    // ==============================================================
    // METHOD 2: Browser print via iframe / window (uses system printer)
    // Works with any printer including EPSON TM series if installed
    // ==============================================================
    function printViaBrowserPrint(lineText) {
        return new Promise((resolve, reject) => {
            if (!lineText.trim()) {
                reject(new Error('Empty text'));
                return;
            }
            
            // Create a hidden iframe for printing
            const iframe = document.createElement('iframe');
            iframe.style.position = 'absolute';
            iframe.style.width = '0';
            iframe.style.height = '0';
            iframe.style.border = 'none';
            document.body.appendChild(iframe);
            
            const iframeDoc = iframe.contentWindow.document;
            
            // Create receipt-style print document (80mm width optimized)
            iframeDoc.open();
            iframeDoc.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Print Receipt</title>
                    <style>
                        @page {
                            size: 80mm auto;
                            margin: 0;
                        }
                        body {
                            font-family: 'Courier New', 'Fira Code', monospace;
                            font-size: 12pt;
                            width: 72mm;
                            margin: 0;
                            padding: 2mm;
                            white-space: pre-wrap;
                            word-wrap: break-word;
                        }
                        .print-line {
                            font-weight: bold;
                            text-align: center;
                            margin: 0;
                            padding: 4px 0;
                            letter-spacing: 0.5px;
                        }
                    </style>
                </thead>
                <body>
                    <div class="print-line">${escapeHtml(lineText)}</div>
                    <div style="height: 10px;"></div>
                </body>
                </html>
            `);
            iframeDoc.close();
            
            // Wait for content to load then print
            iframe.onload = () => {
                setTimeout(() => {
                    try {
                        iframe.contentWindow.focus();
                        iframe.contentWindow.print();
                        setTimeout(() => {
                            document.body.removeChild(iframe);
                            resolve(true);
                        }, 1000);
                    } catch (err) {
                        document.body.removeChild(iframe);
                        reject(err);
                    }
                }, 200);
            };
            
            // Fallback
            setTimeout(() => {
                if (document.body.contains(iframe)) {
                    try {
                        iframe.contentWindow.print();
                        setTimeout(() => {
                            if (document.body.contains(iframe)) {
                                document.body.removeChild(iframe);
                            }
                            resolve(true);
                        }, 1000);
                    } catch (e) {
                        reject(e);
                    }
                }
            }, 500);
        });
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // ==============================================================
    // METHOD 3: Raw ESC/POS via print server / localhost
    // Alternative for network printers (Epson ePOS SDK style)
    // ==============================================================
    async function printViaNetworkPrinter(lineText, printerIP = null) {
        // This is a placeholder for network printing via ePOS-Device or raw TCP
        // For most setups, browser print or WebUSB works better
        setStatus('Network print requires ePOS SDK. Using browser print instead.', 'info');
        return false;
    }
    
    // ==============================================================
    // MAIN PRINT FUNCTION - tries multiple methods
    // ==============================================================
    async function printSingleLine() {
        if (isPrinting) {
            setStatus('Print already in progress. Please wait...', 'warning');
            return;
        }
        
        const lineToPrint = printLineInput.value.trim();
        if (!lineToPrint) {
            setStatus('❌ Cannot print empty line. Please enter text to print.', 'error');
            return;
        }
        
        isPrinting = true;
        printBtn.disabled = true;
        printBtn.innerHTML = '<span>⏳</span> Printing...';
        setStatus('🖨️ Sending to EPSON TM-T88VII...', 'info');
        
        let printSuccess = false;
        let usedMethod = '';
        
        // Try Method 1: WebUSB (direct USB connection)
        if (navigator.usb) {
            try {
                setStatus('🔌 Attempting WebUSB connection to EPSON...', 'info');
                const usbResult = await printViaWebUSB(lineToPrint);
                if (usbResult) {
                    printSuccess = true;
                    usedMethod = 'WebUSB (Direct USB)';
                }
            } catch (usbErr) {
                console.log('WebUSB failed or not selected:', usbErr);
            }
        }
        
        // If WebUSB not available or failed, fallback to browser print
        if (!printSuccess) {
            try {
                setStatus('🖨️ Using system print dialog (EPSON TM driver)', 'info');
                await printViaBrowserPrint(lineToPrint);
                printSuccess = true;
                usedMethod = 'Browser Print (System Dialog)';
            } catch (browserErr) {
                console.error('Browser print error:', browserErr);
                printSuccess = false;
            }
        }
        
        // Final status
        if (printSuccess) {
            setStatus(`✅ Single line printed successfully! (via ${usedMethod})`, 'success');
            // Add a subtle success effect
            printBtn.style.background = "linear-gradient(95deg, #38a169, #2f855a)";
            setTimeout(() => {
                printBtn.style.background = "linear-gradient(95deg, #2d3748, #1a202c)";
            }, 1500);
        } else {
            setStatus('❌ Print failed. Make sure printer is connected and drivers are installed. For USB printers, allow WebUSB permission. For network printers, use system print dialog.', 'error');
        }
        
        // Reset button
        isPrinting = false;
        printBtn.disabled = false;
        printBtn.innerHTML = '<span>🖨️</span> PRINT SINGLE LINE';
        
        // Focus back on input
        printLineInput.focus();
    }
    
    // Attach print handler
    printBtn.addEventListener('click', printSingleLine);
    
    // Enter key in input also triggers print
    printLineInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            printSingleLine();
        }
    });
    
    // Check for WebUSB availability on load
    if (!navigator.usb) {
        setStatus('ℹ️ WebUSB not supported in this browser. Using system print dialog. Ensure EPSON printer is installed as default.', 'info');
    } else {
        setStatus('✅ Ready. Click print — you may select EPSON TM-T88VII via USB or system dialog.', 'success');
    }
    
    // Additional instructions for EPSON TM-T88VII
    console.log('EPSON TM-T88VII M371A Printer Print Utility Loaded');
    console.log('Methods: WebUSB (direct ESC/POS) or Standard Browser Print');
</script>
</body>
</html>
